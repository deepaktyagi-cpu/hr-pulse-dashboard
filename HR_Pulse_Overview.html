<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>HR Pulse — Overview</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
  :root{
    --bg:#f4f3f1; --card:#ffffff; --ink:#1c1c1c; --sub:#6b6b6b; --line:#e8e6e2;
    --sidebar:#111111; --sidebar-ink:#b9b9b9;
    --amber-bg:#fdf3dd; --amber-ink:#8a6316; --amber-border:#f0dfae;
  }
  *{box-sizing:border-box;}
  html,body,#root{height:100%;}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--ink);}

  /* ---------- Login ---------- */
  .login-screen{min-height:100vh;display:flex;align-items:center;justify-content:center;background:#111;}
  .login-card{background:#fff;border-radius:16px;padding:40px 36px;width:360px;box-shadow:0 20px 60px rgba(0,0,0,.35);}
  .login-brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:18px;margin-bottom:26px;}
  .login-brand .badge{width:30px;height:30px;border-radius:9px;background:#1f9d6b;display:flex;align-items:center;justify-content:center;color:#fff;font-size:15px;}
  .login-field{margin-bottom:16px;}
  .login-field label{display:block;font-size:12px;font-weight:600;color:#555;margin-bottom:6px;}
  .login-field input{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:8px;font-size:14px;}
  .login-btn{width:100%;padding:11px;border:none;border-radius:8px;background:#111;color:#fff;font-weight:600;font-size:14px;cursor:pointer;margin-top:8px;}
  .login-btn:hover{background:#000;}
  .login-note{font-size:11px;color:#999;text-align:center;margin-top:14px;}

  /* ---------- App shell ---------- */
  .app{display:flex;min-height:100vh;}
  .sidebar{width:220px;background:var(--sidebar);color:var(--sidebar-ink);flex-shrink:0;padding:20px 0;position:sticky;top:0;height:100vh;overflow-y:auto;}
  .brand{display:flex;align-items:center;gap:10px;padding:0 20px 24px;font-weight:700;color:#fff;font-size:15px;}
  .brand .badge{width:28px;height:28px;border-radius:8px;background:#1f9d6b;display:flex;align-items:center;justify-content:center;font-size:14px;color:#fff;}
  .nav-item{display:flex;align-items:center;gap:10px;padding:10px 20px;font-size:14px;cursor:pointer;color:var(--sidebar-ink);border:none;background:none;width:100%;text-align:left;font-family:inherit;}
  .nav-item:hover{color:#fff;}
  .nav-item.active{background:#fff;color:#111;font-weight:600;border-radius:0 20px 20px 0;margin-right:14px;}
  .nav-item .dot{width:6px;height:6px;border-radius:50%;background:currentColor;opacity:.55;flex-shrink:0;}
  .sidebar-footer{margin-top:auto;padding:16px 20px 0;}
  .signout-side{border:1px solid #333;background:transparent;color:#ccc;padding:8px 12px;border-radius:8px;font-size:12px;cursor:pointer;width:100%;}

  .main{flex:1;min-width:0;display:flex;flex-direction:column;}
  .topbar{display:flex;align-items:center;justify-content:space-between;padding:16px 28px;border-bottom:1px solid var(--line);background:var(--bg);position:sticky;top:0;z-index:5;}
  .topbar h2{margin:0;font-size:15px;font-weight:600;}
  .signout{border:1px solid var(--line);background:#fff;padding:6px 14px;border-radius:8px;font-size:13px;cursor:pointer;}

  .content{padding:28px;max-width:1400px;}
  .page-title{font-size:26px;font-weight:700;margin:0 0 4px;}
  .page-sub{color:var(--sub);font-size:13px;margin:0 0 20px;}

  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px 22px;margin-bottom:20px;}
  .card-clickable{cursor:pointer;transition:box-shadow .15s ease, transform .15s ease;}
  .card-clickable:hover{box-shadow:0 6px 20px rgba(0,0,0,.08);transform:translateY(-1px);}
  .card-clickable:focus-visible{outline:2px solid #1f9d6b;outline-offset:2px;}
  .card-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px;}
  .card-title{font-size:13px;font-weight:700;letter-spacing:.03em;text-transform:uppercase;color:#333;}
  .card-arrow{color:#999;font-size:16px;}
  .card-caption{font-size:12px;color:var(--sub);margin:0 0 14px;}

  table{width:100%;border-collapse:collapse;font-size:14px;}
  thead th{text-align:left;font-size:11px;color:var(--sub);text-transform:uppercase;letter-spacing:.03em;font-weight:600;padding:8px 10px;border-bottom:1px solid var(--line);}
  tbody td{padding:12px 10px;border-bottom:1px solid var(--line);}
  tbody tr:last-child td{border-bottom:none;}
  .seg-name{font-weight:700;}
  .muted{color:#a3a3a3;}

  .grid-3{display:grid;grid-template-columns:1.4fr 1.4fr 1fr;gap:20px;}
  .grid-2{display:grid;grid-template-columns:1fr 1fr;gap:20px;}
  .chart-wrap{position:relative;height:190px;margin-bottom:10px;}
  .legend-row{display:flex;flex-wrap:wrap;gap:14px;font-size:11px;color:#444;margin-top:4px;}
  .legend-dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px;}

  .empty-note{display:flex;gap:8px;align-items:flex-start;background:var(--amber-bg);border:1px solid var(--amber-border);color:var(--amber-ink);font-size:13px;border-radius:10px;padding:12px 14px;}

  .list-row{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--line);font-size:14px;}
  .list-row:last-child{border-bottom:none;}
  .list-row b{font-weight:700;}

  .stub-wrap{display:flex;align-items:center;justify-content:center;min-height:60vh;}
  .stub-box{text-align:center;max-width:420px;}
  .stub-box h1{font-size:22px;margin-bottom:8px;}
  .stub-box p{color:var(--sub);font-size:14px;line-height:1.5;}
  .stub-back{margin-top:18px;border:1px solid var(--line);background:#fff;padding:8px 16px;border-radius:8px;font-size:13px;cursor:pointer;}

  /* ---------- Manning page ---------- */
  .page-header-row{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:20px;flex-wrap:wrap;gap:12px;}
  .filter-group{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--sub);}
  .filter-group select{padding:7px 10px;border:1px solid var(--line);border-radius:8px;font-size:13px;background:#fff;color:var(--ink);font-family:inherit;min-width:160px;}
  .kpi-row{display:grid;grid-template-columns:repeat(2,1fr);gap:20px;margin-bottom:20px;}
  .kpi-card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px 20px;}
  .kpi-label{font-size:11px;color:var(--sub);text-transform:uppercase;letter-spacing:.03em;font-weight:600;margin-bottom:6px;}
  .kpi-value{font-size:30px;font-weight:700;}
  .heatmap-scroll{overflow-x:auto;}
  table.heatmap{font-size:13px;}
  table.heatmap th{white-space:nowrap;}
  table.heatmap td{white-space:nowrap;text-align:center;font-weight:600;border-bottom:none;padding:9px 12px;}
  table.heatmap td.rowlabel{text-align:left;font-weight:600;background:#fff;position:sticky;left:0;}
  table.heatmap tbody tr:nth-child(1) td.rowlabel{font-weight:800;}
  .funnel-table td{text-align:center;}
  .funnel-table td.rowlabel{text-align:left;font-weight:700;}

  @media (max-width: 1100px){
    .grid-3{grid-template-columns:1fr;}
    .grid-2{grid-template-columns:1fr;}
    .kpi-row{grid-template-columns:1fr;}
  }
  @media (max-width: 720px){
    .app{flex-direction:column;}
    .sidebar{width:100%;height:auto;position:relative;display:flex;flex-wrap:nowrap;overflow-x:auto;padding:12px 8px;}
    .brand{display:none;}
    .sidebar-footer{display:none;}
    .nav-item{white-space:nowrap;border-radius:8px !important;margin:0 4px !important;}
    .content{padding:16px;}
    table{font-size:12px;}
    thead th, tbody td{padding:8px 6px;}
    .page-header-row{flex-direction:column;align-items:stretch;}
  }
</style>
</head>

function fmtFunnel(metric, val){
  if (val === null || val === undefined) return "—";
  if (val === "--") return "—";
  if (typeof val === "string") return val; // ratio strings like "1:4"
  if (metric === "Offer to Joining %" || metric === "Source Mix % (Non-Referral)") return Math.round(val*100) + "%";
  return val;
}

function useHashRoute(){
  const [hash, setHash] = useState(window.location.hash || "#/login");
  useEffect(() => {
    const onChange = () => setHash(window.location.hash || "#/login");
    window.addEventListener("hashchange", onChange);
    window.addEventListener("popstate", onChange);
    return () => {
      window.removeEventListener("hashchange", onChange);
      window.removeEventListener("popstate", onChange);
    };
  }, []);
  return hash;
}
function navigate(route){ window.location.hash = route; }

/* ============================ CHART HOOK ============================ */
// Formats a 0-1 fraction as a percentage string with up to `decimals`
// decimal places, stripping unnecessary trailing zeros (matches the
// workbook's own number formats: Manning = whole %, Attrition = up to
// 2 decimals). Used for chart TOOLTIPS only — axis ticks/data/scales
// are untouched.
function pctTooltip(v, decimals){
  if (v === null || v === undefined) return "—";
  const num = parseFloat((v*100).toFixed(decimals));
  return num + "%";
}

function useLineChart(canvasRef, sourceBlock, { isPercent, dashedExtra, pctDecimals=0 } = {}){
  useEffect(() => {
    if (!canvasRef.current) return;
    const datasets = SEGMENT_REGISTRY.map(seg => ({
      label: seg.label,
      data: PERIOD_REGISTRY.map(p => sourceBlock[p] ? sourceBlock[p][seg.id] : null),
      borderColor: seg.color,
      backgroundColor: seg.color,
      yAxisID: seg.axisTier === "MS" ? "yLeft" : "yRight",
      tension: 0.35,
      pointRadius: 3,
      spanGaps: true,
    }));
    if (dashedExtra){
      datasets.push({
        label: dashedExtra.label,
        data: PERIOD_REGISTRY.map(p => dashedExtra.source[p]),
        borderColor: "#9CA3AF", borderDash:[5,4], pointRadius:0, yAxisID:"yLeft", tension:0,
      });
    }
    const chart = new Chart(canvasRef.current, {
      type: "line",
      data: { labels: PERIOD_REGISTRY, datasets },
      options: {
        responsive: true, maintainAspectRatio:false,
        plugins:{
          legend:{ display:false },
          tooltip:{
            callbacks:{
              // Tooltip-only fix: was showing the raw 0-1 fraction (e.g.
              // 0.99, 0.068) even though the axis already displayed a
              // percentage. No change to data/axes/scales/business logic.
              label: (ctx) => {
                const v = ctx.parsed.y;
                const val = isPercent ? pctTooltip(v, pctDecimals) : v;
                return `${ctx.dataset.label}: ${val}`;
              }
            }
          }
        },
        scales:{
          yLeft:{ position:"left", ticks:{ callback:v=> isPercent ? Math.round(v*100)+"%" : v, font:{size:10} }, title:{display:true,text:"Mid & Senior Level",font:{size:10}} },
          yRight:{ position:"right", grid:{drawOnChartArea:false}, ticks:{ callback:v=> isPercent ? Math.round(v*100)+"%" : v, font:{size:10} }, title:{display:true,text:"Entry Level",font:{size:10}} },
          x:{ ticks:{ font:{size:10} } },
        }
      }
    });
    return () => chart.destroy();
  }, [canvasRef, sourceBlock, isPercent, dashedExtra, pctDecimals]);
}

function Legend({ extra }){

    <div className="legend-row">

    </div>
  );
}

function TrendChart({ sourceBlock, isPercent, dashedExtra, pctDecimals=0 }){
  const ref = useRef(null);
  useLineChart(ref, sourceBlock, { isPercent, dashedExtra, pctDecimals });
  return <div className="chart-wrap"><canvas ref={ref}></canvas></div>;
}

// Heatmap color helpers — reproduce the workbook's exact CF stops.
function manningPctColor(v){
  if (v === null || v === undefined) return "transparent";
  // 3-color scale: 0.7 red -> 0.9 amber -> 1.0 green (absolute stops, Manning!C12:I27 CF rule)
  const stops = [[0.7,[248,105,107]],[0.9,[255,235,132]],[1.0,[99,190,123]]];
  if (v <= stops[0][0]) return `rgb(${stops[0][1].join(",")})`;
  if (v >= stops[2][0]) return `rgb(${stops[2][1].join(",")})`;
  if (v <= stops[1][0]){
    const t = (v - stops[0][0]) / (stops[1][0]-stops[0][0]);
    return lerpColor(stops[0][1], stops[1][1], t);
  }
  const t = (v - stops[1][0]) / (stops[2][0]-stops[1][0]);
  return lerpColor(stops[1][1], stops[2][1], t);
}
function lerpColor(a,b,t){
  const c = a.map((v,i)=>Math.round(v + (b[i]-v)*t));
  return `rgb(${c.join(",")})`;
}
function headcountColor(v, min, max){
  if (v === null || v === undefined) return "transparent";
  if (max === min) return "rgb(255,255,255)";
  const t = (v - min) / (max - min); // relative min/max scale, Manning!P12:V27 CF rule
  return lerpColor([255,255,255],[78,121,167], t);
}
function funnelColor(v){
  if (v === null || v === undefined || typeof v === "string") return "transparent";
  const stops = [[0.5,[248,105,107]],[0.75,[255,235,132]],[0.95,[99,190,123]]];
  if (v <= stops[0][0]) return `rgb(${stops[0][1].join(",")})`;
  if (v >= stops[2][0]) return `rgb(${stops[2][1].join(",")})`;
  if (v <= stops[1][0]){
    const t = (v - stops[0][0]) / (stops[1][0]-stops[0][0]);
    return lerpColor(stops[0][1], stops[1][1], t);
  }
  const t = (v - stops[1][0]) / (stops[2][0]-stops[1][0]);
  return lerpColor(stops[1][1], stops[2][1], t);
}

function ManningPctHeatmap({ segmentId }){
  const depts = MANNING_DEPT_REGISTRY[segmentId];
  const data = MANNING_PCT_BY_DEPT[segmentId];
  return (
    <div className="card">
      <div className="card-head"><div className="card-title">Manning % by Dept (heat map)</div></div>
      <div className="card-caption">Scale: red = low, green = high manning %</div>
      <div className="heatmap-scroll">
        <table className="heatmap">
          <thead><tr><th>Dept</th>{PERIOD_REGISTRY.map(p=><th key={p}>{p}</th>)}</tr></thead>
          <tbody>
            {depts.map(dept => (
              <tr key={dept}>
                <td className="rowlabel">{dept}</td>
                {PERIOD_REGISTRY.map((p,i) => {
                  const v = data[dept] ? data[dept][i] : null;
                  return <td key={p} style={{background:manningPctColor(v)}}>{v===null||v===undefined ? "—" : Math.round(v*100)+"%"}</td>;
                })}
              </tr>
            ))}
          </tbody>
        </table>
      </div>
    </div>
  );
}

function HeadcountHeatmap({ segmentId }){
  const depts = MANNING_DEPT_REGISTRY[segmentId];
  const data = HEADCOUNT_BY_DEPT[segmentId];
  const allVals = depts.flatMap(d => (data[d]||[]).filter(v=>v!==null && v!==undefined));
  const min = Math.min(...allVals), max = Math.max(...allVals);
  return (
    <div className="card">
      <div className="card-head"><div className="card-title">Headcount by Dept (heat map)</div></div>
      <div className="card-caption">Scale: darker blue = higher headcount</div>
      <div className="heatmap-scroll">
        <table className="heatmap">
          <thead><tr><th>Dept</th>{PERIOD_REGISTRY.map(p=><th key={p}>{p}</th>)}</tr></thead>
          <tbody>
            {depts.map(dept => (
              <tr key={dept}>
                <td className="rowlabel">{dept}</td>
                {PERIOD_REGISTRY.map((p,i) => {
                  const v = data[dept] ? data[dept][i] : null;
                  return <td key={p} style={{background:headcountColor(v,min,max)}}>{v===null||v===undefined ? "—" : v}</td>;
                })}
              </tr>
            ))}
          </tbody>
        </table>
      </div>
    </div>
  );
}

function RecruitmentFunnel({ segmentId, deptId }){
  const funnelData = FUNNEL[segmentId];
  return (
    <div className="card">
      <div className="card-head"><div className="card-title">Over all Recruitment Funnel</div></div>
      <div className="card-caption">Selected → Selection Ratio → Joined → Offer to Joined → Source Mix</div>
      <div className="heatmap-scroll">
        <table className="heatmap funnel-table">
          <thead><tr><th>Metric</th>{PERIOD_REGISTRY.map(p=><th key={p}>{p}</th>)}</tr></thead>
          <tbody>
            {FUNNEL_METRICS.map(metric => (
              <tr key={metric}>
                <td className="rowlabel">{metric}</td>
                {PERIOD_REGISTRY.map((p,i) => {
                  const v = funnelData[metric] && funnelData[metric][deptId] ? funnelData[metric][deptId][i] : null;
                  const bg = (metric==="Offer to Joining %" || metric==="Source Mix % (Non-Referral)") ? funnelColor(v) : "transparent";
                  return <td key={p} style={{background:bg}}>{fmtFunnel(metric, v)}</td>;
                })}
              </tr>
            ))}
          </tbody>
        </table>
      </div>
    </div>
  );
}

function ManningPage(){
  const [segmentId, setSegmentId] = useState(SEGMENT_REGISTRY[0].id); // Manning!C4 equivalent
  const depts = MANNING_DEPT_REGISTRY[segmentId];
  const [deptId, setDeptId] = useState(depts[0]); // Manning!C32 equivalent

  // When segment changes, dept dropdown must reset to that segment's own
  // dept list (workbook: Manning!$BC$1:$BC$21 re-derives per segment).
  useEffect(() => {
    const list = MANNING_DEPT_REGISTRY[segmentId];
    if (!list.includes(deptId)) setDeptId(list[0]);
  }, [segmentId]);

  const manningPctTotal = MANNING_PCT_BY_DEPT[segmentId]["Total"][PERIOD_REGISTRY.length-1];
  const headcountTotal = HEADCOUNT_BY_DEPT[segmentId]["Total"][PERIOD_REGISTRY.length-1];

  return (
    <Shell activeId="manning" title="Manning">
      <div className="page-header-row">
        <div>
          <div className="page-title">Manning</div>
          <div className="page-sub">Select a segment to deep-dive</div>
        </div>
        <div className="filter-group">
          <label htmlFor="segSel">Segment</label>
          <select id="segSel" value={segmentId} onChange={e=>setSegmentId(e.target.value)}>
            {SEGMENT_REGISTRY.map(s => <option key={s.id} value={s.id}>{s.label}</option>)}
          </select>
        </div>
      </div>

      <div className="kpi-row">
        <div className="kpi-card">
          <div className="kpi-label">Manning % (Total) — {LATEST_PERIOD}</div>
          <div className="kpi-value">{Math.round(manningPctTotal*100)}%</div>
        </div>
        <div className="kpi-card">
          <div className="kpi-label">Headcount (Total) — {LATEST_PERIOD}</div>
          <div className="kpi-value">{headcountTotal.toLocaleString("en-IN")}</div>
        </div>
      </div>

      <ManningPctHeatmap segmentId={segmentId} />
      <HeadcountHeatmap segmentId={segmentId} />

      <div className="page-header-row" style={{marginTop:4}}>
        <div className="card-caption" style={{margin:0}}>Recruitment funnel detail</div>
        <div className="filter-group">
          <label htmlFor="deptSel">Segment Dept</label>
          <select id="deptSel" value={deptId} onChange={e=>setDeptId(e.target.value)}>
            {depts.map(d => <option key={d} value={d}>{d}</option>)}
          </select>
        </div>
      </div>

      <RecruitmentFunnel segmentId={segmentId} deptId={deptId} />
    </Shell>
  );
}

/* =========================================================================
   PAYROLL PAGE — DATA MODEL
   Re-read directly from the workbook's hidden `Payroll_Data` sheet for
   THIS page specifically. No assumptions carried over from Overview or
   Manning. PAYROLL_RAW (injected above) is the row-level transaction
   extract (HOD/Leader, Dept [trim_Dept_v1], Category, Segment, Month,
   Job Level, Total/Variable/Gratuity Cost) — every aggregation below is
   computed client-side from these raw rows, exactly the way the
   workbook's own SUMIFS/COUNTIFS/AVERAGEIFS formulas do it. This means
   a new month, department, leader, or job level appearing in the sheet
   flows through automatically — nothing here hardcodes a name.
   ========================================================================= */
let PAYROLL_MONTHS = PAYROLL_RAW.months;                 // dynamic period registry for this page
let PAYROLL_LATEST_MONTH = PAYROLL_MONTHS[PAYROLL_MONTHS.length - 1];
// NOTE: these must stay `let`, not `const` — they are re-derived from
// PAYROLL_RAW inside applyHydratedData_() every time live data is
// hydrated from Apps Script, so Leader/Department/Category/Job Level
// filters never go stale after new/renamed/removed values in the sheet.
let PAYROLL_HODS = PAYROLL_RAW.hods;
let PAYROLL_DEPTS = PAYROLL_RAW.depts;
let PAYROLL_CATS = PAYROLL_RAW.cats;
let PAYROLL_JOBLEVELS = PAYROLL_RAW.joblevels;

// records: [hodIdx, deptIdx, catIdx, segIdx, monthIdx, jobIdx, totalCost, variableCost, gratuityCost]
function payrollFilter({ segIdx, monthIdx, hodIdx, deptIdx, catIdx, jobIdx }){
  return PAYROLL_RAW.records.filter(r =>
    (segIdx===undefined || r[3]===segIdx) &&
    (monthIdx===undefined || r[4]===monthIdx) &&
    (hodIdx===undefined || r[0]===hodIdx) &&
    (deptIdx===undefined || r[1]===deptIdx) &&
    (catIdx===undefined || r[2]===catIdx) &&
    (jobIdx===undefined || r[5]===jobIdx)
  );
}
function sumCol(rows, col){ return rows.reduce((a,r)=>a+r[col], 0); } // col: 6=total,7=variable,8=gratuity
function lakh(v){ return v/100000; }

function segIndexOf(segId){ return PAYROLL_RAW.segs.indexOf(segId); }

// ---- Section 1: Overall Payroll Trend ----
function overallPayrollTrend(segmentId){
  const si = segIndexOf(segmentId);
  return PAYROLL_MONTHS.map((m,mi) => lakh(sumCol(payrollFilter({segIdx:si, monthIdx:mi}), 6)));
}

// ---- Section 2: Category Payroll Trend (categories present for this segment) ----
function categoryPayrollTrend(segmentId){
  const si = segIndexOf(segmentId);
  const catsPresent = PAYROLL_CATS.map((cat,ci)=>({cat,ci}))
    .filter(({ci}) => payrollFilter({segIdx:si, catIdx:ci}).length > 0);
  return catsPresent.map(({cat,ci}) => ({
    label: cat,
    values: PAYROLL_MONTHS.map((m,mi) => {
      const rows = payrollFilter({segIdx:si, catIdx:ci, monthIdx:mi});
      return rows.length ? Math.round(lakh(sumCol(rows,6))*10)/10 : null;
    }),
  }));
}

// ---- Section 3: HOD Payroll Trend (HODs present for this segment) ----
function hodPayrollTrend(segmentId){
  const si = segIndexOf(segmentId);
  const hodsPresent = PAYROLL_HODS.map((hod,hi)=>({hod,hi}))
    .filter(({hi}) => payrollFilter({segIdx:si, hodIdx:hi}).length > 0);
  return hodsPresent.map(({hod,hi}) => ({
    label: hod,
    values: PAYROLL_MONTHS.map((m,mi) => {
      const rows = payrollFilter({segIdx:si, hodIdx:hi, monthIdx:mi});
      return rows.length ? Math.round(lakh(sumCol(rows,6))*10)/10 : null;
    }),
  }));
}

// ---- Section 4: Leader Analysis ----
// Leader dropdown options are scoped to the CURRENT segment (workbook:
// Payroll!Z1 formula filters Payroll_Data by $C$4 before listing HODs).
function leadersForSegment(segmentId){
  const si = segIndexOf(segmentId);
  return PAYROLL_HODS.filter((hod,hi) => payrollFilter({segIdx:si, hodIdx:hi}).length > 0);
}

// Department list shown = depts where the selected leader has employees
// in the selected segment+month (workbook: FILTER by Segment+HOD+Month).
function leaderDeptRows(segmentId, leaderHod, monthLabel){
  const si = segIndexOf(segmentId);
  const hi = PAYROLL_HODS.indexOf(leaderHod);
  const mi = PAYROLL_MONTHS.indexOf(monthLabel);
  const deptsPresent = PAYROLL_DEPTS.map((dept,di)=>({dept,di}))
    .filter(({di}) => payrollFilter({segIdx:si, hodIdx:hi, deptIdx:di, monthIdx:mi}).length > 0);
  return deptsPresent.map(({dept,di}) => {
    // Total/Variable/Gratuity: summed across the WHOLE segment for this dept+month
    // (workbook does NOT scope these to the leader — verified in the SUMIFS formula).
    const segRows = payrollFilter({segIdx:si, deptIdx:di, monthIdx:mi});
    // Avg Salary: filtered by the LEADER directly (not segment) — a deliberately
    // different filter scope, exactly as the workbook's F60 formula does it.
    const hodRows = payrollFilter({hodIdx:hi, deptIdx:di, monthIdx:mi});
    const avgSalary = hodRows.length ? sumCol(hodRows,6) / hodRows.length : null;
    return {
      dept,
      totalPayroll: lakh(sumCol(segRows,6)),
      variableCost: lakh(sumCol(segRows,7)),
      gratuityCost: lakh(sumCol(segRows,8)),
      avgSalary,
    };
  });
}

// Job Level Summary — identical shape, keyed on Job Level instead of Dept.
function leaderJobLevelRows(segmentId, leaderHod, monthLabel){
  const si = segIndexOf(segmentId);
  const hi = PAYROLL_HODS.indexOf(leaderHod);
  const mi = PAYROLL_MONTHS.indexOf(monthLabel);
  const levelsPresent = PAYROLL_JOBLEVELS.map((lvl,li)=>({lvl,li}))
    .filter(({li}) => payrollFilter({segIdx:si, hodIdx:hi, jobIdx:li, monthIdx:mi}).length > 0);
  return levelsPresent.map(({lvl,li}) => {
    const segRows = payrollFilter({segIdx:si, jobIdx:li, monthIdx:mi});
    const hodRows = payrollFilter({hodIdx:hi, jobIdx:li, monthIdx:mi});
    const avgSalary = hodRows.length ? sumCol(hodRows,6) / hodRows.length : null;
    return {
      lvl,
      totalPayroll: lakh(sumCol(segRows,6)),
      variableCost: lakh(sumCol(segRows,7)),
      gratuityCost: lakh(sumCol(segRows,8)),
      avgSalary,
    };
  });
}

// Department Cost Trend — 3-month trend per dept (leader's dept list),
// with month-over-month Trend % (workbook: (latest-previous)/previous).
function departmentCostTrend(segmentId, leaderHod, monthLabel){
  const si = segIndexOf(segmentId);
  const hi = PAYROLL_HODS.indexOf(leaderHod);
  const mi = PAYROLL_MONTHS.indexOf(monthLabel);
  const deptsPresent = PAYROLL_DEPTS.map((dept,di)=>({dept,di}))
    .filter(({di}) => payrollFilter({segIdx:si, hodIdx:hi, deptIdx:di, monthIdx:mi}).length > 0);
  return deptsPresent.map(({dept,di}) => {
    const values = PAYROLL_MONTHS.map((m,i) => lakh(sumCol(payrollFilter({segIdx:si, deptIdx:di, monthIdx:i}),6)));
    const latest = values[values.length-1], prev = values[values.length-2];
    const trendPct = (prev && prev !== 0) ? (latest-prev)/prev : null;
    return { dept, values, trendPct };
  });
}

function fmtRupeeL(v){ return v===null||v===undefined ? "—" : "₹"+v.toFixed(1)+"L"; }
function fmtRupeeWhole(v){ return v===null||v===undefined ? "—" : "₹"+Math.round(v).toLocaleString("en-IN"); }
function fmtPct1(v){ return v===null||v===undefined ? "—" : (v>=0?"▲ ":"▼ ")+Math.abs(v*100).toFixed(1)+"%"; }

function Sparkline({ values, width=90, height=28, color="#2563EB" }){
  const valid = values.filter(v=>v!==null && v!==undefined);
  if (valid.length < 2) return <svg width={width} height={height}></svg>;
  const min = Math.min(...valid), max = Math.max(...valid);
  const span = (max-min) || 1;
  const stepX = width/(values.length-1);
  const pts = values.map((v,i) => v===null||v===undefined ? null : [i*stepX, height - ((v-min)/span)*height]).filter(Boolean);
  const path = pts.map(p=>p.join(",")).join(" ");
  return (
    <svg width={width} height={height}>
      <polyline points={path} fill="none" stroke={color} strokeWidth="2" />
      {pts.length>0 && <circle cx={pts[pts.length-1][0]} cy={pts[pts.length-1][1]} r="2.5" fill={color} />}
    </svg>
  );
}

function PayrollOverallTrendChart({ segmentId }){
  const ref = useRef(null);
  useEffect(() => {
    if (!ref.current) return;
    const values = overallPayrollTrend(segmentId);
    const chart = new Chart(ref.current, {
      type:"line",
      data:{ labels:PAYROLL_MONTHS, datasets:[{ label:"Total Payroll (₹L)", data:values, borderColor:"#2563EB", backgroundColor:"#2563EB", tension:0.3, pointRadius:3 }] },
      options:{ responsive:true, maintainAspectRatio:false, plugins:{legend:{display:false}},
        scales:{ y:{ ticks:{ callback:v=>"₹"+v, font:{size:10} } }, x:{ ticks:{font:{size:10}} } } }
    });
    return () => chart.destroy();
  }, [segmentId]);
  return <div className="chart-wrap" style={{height:170}}><canvas ref={ref}></canvas></div>;
}

/* =========================================================================
   ATTENDANCE PAGE — DATA MODEL
   Re-read directly from the workbook's hidden `Attendance_Data` sheet for
   THIS page specifically. No assumptions carried over from Overview,
   Manning, or Payroll. ATTENDANCE_RAW (injected above) is the row-level
   employee extract (Department, Grade, Segment, Present/Absent/Leave
   Days, <8Hr Flag, Regularization %). Every metric below is computed
   client-side from these raw rows, replicating the workbook's own
   SUMIFS/COUNTIFS/AVERAGEIFS formulas exactly — including the subtle,
   verified quirks (see comments below) rather than a simplified
   approximation. New departments/grades in the sheet flow through
   automatically since nothing here hardcodes a name.

   IMPORTANT — verified directly from the workbook, NOT reused from any
   prior page's assumptions:
   - Attendance's segment selector cell is D4, not C4 (a genuine
     inconsistency in the source workbook vs. Manning/Payroll/Attrition).
   - No conditional-formatting rule exists on Attendance in the .xlsx
     despite every section being labeled "heat map" — the coloring below
     is a deliberate UI addition using the same 0.75/0.5 thresholds the
     workbook's own flag formula uses, since no CF rule exists to port.
   - The Grade block reuses the identical 4-metric pattern but has NO
     flag column in the workbook — replicated faithfully (no flag shown
     for grade rows).
   - Avg Leave Days denominator reuses the "present days > 0" employee
     count, not a leave-specific count (a real, non-obvious modeling
     choice in the source formula) — replicated exactly below.
   ========================================================================= */
// NOTE: these must stay `let`, not `const` — re-derived from
// ATTENDANCE_RAW inside applyHydratedData_() on every hydration so the
// Segment/Department/Grade filters never go stale.
let ATT_SEGS = ATTENDANCE_RAW.segs;
let ATT_DEPTS = ATTENDANCE_RAW.depts;
let ATT_GRADES = ATTENDANCE_RAW.grades;

// records: [deptIdx, gradeIdx, segIdx, presentDays, absentDays, leaveDays, flagYes(0/1), regPct]
function attRows({ segIdx, deptIdx, gradeIdx }){
  return ATTENDANCE_RAW.records.filter(r =>
    (segIdx===undefined || r[2]===segIdx) &&
    (deptIdx===undefined || r[0]===deptIdx) &&
    (gradeIdx===undefined || r[1]===gradeIdx)
  );
}

function computeAttendanceMetrics(rows){
  // Attendance % = sum(present where present>0) / (sum(present>0)+sum(absent>0)+sum(leave>0))
  const presentSum = rows.filter(r=>r[3]>0).reduce((a,r)=>a+r[3],0);
  const absentSum = rows.filter(r=>r[4]>0).reduce((a,r)=>a+r[4],0);
  const leaveSum = rows.filter(r=>r[5]>0).reduce((a,r)=>a+r[5],0);
  const denom = presentSum + absentSum + leaveSum;
  const attendancePct = denom > 0 ? presentSum/denom : null;

  // Avg Present Days = sum(present>0) / count(present>0)
  const presentCountRows = rows.filter(r=>r[3]>0);
  const avgPresentDays = presentCountRows.length ? presentSum/presentCountRows.length : null;

  // Avg Leave Days = sum(leave where leave>0) / count(present>0)  <-- verified quirk, reuses present-count denominator
  const avgLeaveDays = presentCountRows.length ? leaveSum/presentCountRows.length : null;

  // <8Hr Employees % = count(flag=Yes) / count(all rows for this dept+segment)
  const flagCount = rows.reduce((a,r)=>a+r[6],0);
  const lt8hrPct = rows.length ? flagCount/rows.length : null;

  // Regularization % = average of per-employee Regularization% where present>0
  const regRows = rows.filter(r=>r[3]>0);
  const regPct = regRows.length ? regRows.reduce((a,r)=>a+r[7],0)/regRows.length : null;

  // Flag: Attendance% < 75% -> "Low attendance"; else <8Hr% > 50% -> "High <8hr"; else blank
  let flag = "";
  if (attendancePct !== null && attendancePct < 0.75) flag = "Low attendance";
  else if (lt8hrPct !== null && lt8hrPct > 0.5) flag = "High <8hr";

  return { attendancePct, avgPresentDays, avgLeaveDays, lt8hrPct, regPct, flag };
}

function attColor(pct){
  // No CF rule exists in the workbook for this — using the same
  // 0.75 threshold the flag formula itself encodes, red->green scale.
  if (pct === null || pct === undefined) return "transparent";
  const stops = [[0.5,[248,105,107]],[0.75,[255,235,132]],[1.0,[99,190,123]]];
  if (pct <= stops[0][0]) return `rgb(${stops[0][1].join(",")})`;
  if (pct >= stops[2][0]) return `rgb(${stops[2][1].join(",")})`;
  if (pct <= stops[1][0]){
    const t = (pct-stops[0][0])/(stops[1][0]-stops[0][0]);
    return lerpColor(stops[0][1], stops[1][1], t);
  }
  const t = (pct-stops[1][0])/(stops[2][0]-stops[1][0]);
  return lerpColor(stops[1][1], stops[2][1], t);
}

function fmtPctA(v){ return v===null||v===undefined ? "—" : Math.round(v*100)+"%"; }
function fmtNum1(v){ return v===null||v===undefined ? "—" : (Math.round(v*10)/10); }

function AttendancePage(){
  const [segmentId, setSegmentId] = useState(SEGMENT_REGISTRY[0].id); // Attendance!D4 equivalent
  const segIdx = ATT_SEGS.indexOf(segmentId);

  // Department list dynamically derived: only depts with rows for this segment.
  const deptsPresent = useMemo(() => ATT_DEPTS.filter((d,di) => attRows({segIdx, deptIdx:di}).length > 0), [segIdx]);
  // Grade list dynamically derived: only grades with rows for this segment.
  const gradesPresent = useMemo(() => ATT_GRADES.filter((g,gi) => attRows({segIdx, gradeIdx:gi}).length > 0), [segIdx]);

  const deptRows = deptsPresent.map(dept => {
    const di = ATT_DEPTS.indexOf(dept);
    return { dept, ...computeAttendanceMetrics(attRows({segIdx, deptIdx:di})) };
  });
  const gradeRows = gradesPresent.map(grade => {
    const gi = ATT_GRADES.indexOf(grade);
    return { grade, ...computeAttendanceMetrics(attRows({segIdx, gradeIdx:gi})) };
  });

  return (
    <Shell activeId="attendance" title="Attendance">
      <div className="page-header-row">
        <div>
          <div className="page-title">Attendance</div>
          <div className="page-sub">Departments &amp; grades of the selected segment (active employees)</div>
        </div>
        <div className="filter-group">
          <label htmlFor="attSegSel">Segment</label>
          <select id="attSegSel" value={segmentId} onChange={e=>setSegmentId(e.target.value)}>
            {SEGMENT_REGISTRY.map(s => <option key={s.id} value={s.id}>{s.label}</option>)}
          </select>
        </div>
      </div>

      <div className="card">
        <div className="card-head"><div className="card-title">Attendance % by Department (heat map)</div></div>
        <div className="card-caption">Scale: red = low, green = high attendance %. Threshold: &lt;75% = Low attendance, &gt;50% "&lt;8hr" employees = High &lt;8hr.</div>
        <div className="heatmap-scroll">
          <table className="heatmap">
            <thead><tr><th>Department</th><th>Attendance %</th><th>Avg Present Days</th><th>Avg Leave Days</th><th>&lt; 8 Hr Employees %</th><th>Regularization %</th><th>⚠ Flag</th></tr></thead>
            <tbody>
              {deptRows.map(r => (
                <tr key={r.dept}>
                  <td className="rowlabel">{r.dept}</td>
                  <td style={{background:attColor(r.attendancePct)}}>{fmtPctA(r.attendancePct)}</td>
                  <td>{fmtNum1(r.avgPresentDays)}</td>
                  <td>{fmtNum1(r.avgLeaveDays)}</td>
                  <td>{fmtPctA(r.lt8hrPct)}</td>
                  <td>{fmtPctA(r.regPct)}</td>
                  <td style={{color: r.flag ? "#c0392b" : "#999", fontWeight: r.flag?700:400}}>{r.flag ? "⚠ "+r.flag : "—"}</td>
                </tr>
              ))}
            </tbody>

const ATTR_SEG_TIER = { SaaS_MS:"MS", MP_MS:"MS", SaaS_entry:"entry", MP_entry:"entry" };
const TENURE_BUCKETS_BY_TIER = { MS:["0_6","6_12","12_24","24+"], entry:["0_3","3_6","6_12","12+"] };
let ATTR_HEATMAP_PERIODS = PERIOD_REGISTRY; // reuse workbook's 7-period dept heatmap range (AMJ'25->Jun'26) — verified identical range to Manning's

function attrColor(v, invert){
  // 3-color scale: green=low/good, red=high/bad for attrition (reversed vs Manning's Manning% scale) — verified CF rule direction.
  if (v === null || v === undefined) return "transparent";
  const stops = [[0,[99,190,123]],[0.15,[255,235,132]],[0.4,[248,105,107]]];
  if (v <= stops[0][0]) return `rgb(${stops[0][1].join(",")})`;
  if (v >= stops[2][0]) return `rgb(${stops[2][1].join(",")})`;
  if (v <= stops[1][0]){
    const t = (v-stops[0][0])/(stops[1][0]-stops[0][0]);
    return lerpColor(stops[0][1], stops[1][1], t);
  }
  const t = (v-stops[1][0])/(stops[2][0]-stops[1][0]);
  return lerpColor(stops[1][1], stops[2][1], t);
}
function reasonColor(v, min, max){
  if (v === null || v === undefined) return "transparent";
  if (max===min) return "rgb(135,201,126)";
  const t = (v-min)/(max-min);
  return lerpColor([135,201,126],[254,218,128], t); // green(low mentions)->amber(high mentions)
}

function AttrHeatmap({ title, caption, dataBlock, segmentId }){
  const depts = Object.keys(dataBlock[segmentId] || {});
  return (
    <div className="card">
      <div className="card-head"><div className="card-title">{title}</div></div>
      <div className="card-caption">{caption}</div>
      <div className="heatmap-scroll">
        <table className="heatmap">
          <thead><tr><th>Dept</th>{ATTR_HEATMAP_PERIODS.map(p=><th key={p}>{p}</th>)}</tr></thead>
          <tbody>
            {depts.map(dept => (
              <tr key={dept}>
                <td className="rowlabel">{dept}</td>
                {ATTR_HEATMAP_PERIODS.map((p,i) => {
                  const v = dataBlock[segmentId][dept][i];
                  return <td key={p} style={{background:attrColor(v)}}>{v===null||v===undefined?"—":Math.round(v*100)+"%"}</td>;
                })}
              </tr>
            ))}
          </tbody>
        </table>
      </div>
    </div>
  );
}

  // reason cols indices 2..7 in each record; theme cols 8..17
  // Orientation matches Attrition!B68:H72 exactly: Quarter as rows, reason
  // as columns (same underlying SUM(reason)/SUM(all reasons) calc as

  const rows = EXIT_RAW.qtrs.map((q,qi) => {
    const qtrRecords = EXIT_RAW.records.filter(r => r[0]===si && r[1]===qi);

  return (

      <div className="heatmap-scroll">

                  const sum = r.records.reduce((a,rec) => a + rec[2+ri], 0);
                  const pct = r.totalTagged > 0 ? sum / r.totalTagged : null;
                  const allPctsThisCol = rows.map(rr => {
                    const s = rr.records.reduce((a,rec) => a + rec[2+ri], 0);
                    return rr.totalTagged > 0 ? s/rr.totalTagged : null;
                  }).filter(v=>v!==null);
                  const min = allPctsThisCol.length ? Math.min(...allPctsThisCol) : 0;
                  const max = allPctsThisCol.length ? Math.max(...allPctsThisCol) : 1;
                  return <td key={label} style={{background: pct===null?"transparent":reasonColor(pct,min,max)}}>{pct===null ? "—" : Math.round(pct*100)+"%"}</td>;
                })}
              </tr>
            ))}
          </tbody>
        </table>
      </div>
    </div>
  );
}

// Top reasons for leaving — Leader Wise Analysis (Attrition!B75:H82 equivalent).
// Rows = Business Leaders present for the selected segment + quarter (derived
// live from EXIT_RAW.records — never hardcoded), columns = reason labels.
// % = SUM(reason flag) / SUM(all reason flags) for that leader's exits in the
// selected quarter — identical method to ExitReasonsTable, just grouped by
// leader (col 18) instead of by quarter alone.
function LeaderWiseExitTable({ segmentId, qtr, onQtrChange }){
  const si = EXIT_RAW.segs.indexOf(segmentId);
  const qi = EXIT_RAW.qtrs.indexOf(qtr);
  if (si === -1) return null;
  const leaderIdxs = useMemo(() => {
    const set = new Set();
    EXIT_RAW.records.forEach(r => { if (r[0]===si && r[1]===qi && r[18]>=0) set.add(r[18]); });
    return [...set].sort((a,b) => EXIT_RAW.leaders[a].localeCompare(EXIT_RAW.leaders[b]));
  }, [si, qi]);

  return (
    <div className="card">
      <div className="card-head"><div className="card-title">2 Top reasons for leaving — trend (mentions per quarter)</div></div>
      <div className="filter-group" style={{margin:"0 0 14px"}}>
        <label htmlFor="exitQtrSel">Month / Quarter→</label>
        <select id="exitQtrSel" value={qtr} onChange={e=>onQtrChange(e.target.value)}>
          {EXIT_RAW.qtrs.map(q => <option key={q} value={q}>{q}</option>)}
        </select>
      </div>
      <div className="heatmap-scroll">
        <table className="heatmap">
          <thead><tr><th>Leaders</th>{EXIT_RAW.reasonLabels.map(l=><th key={l}>{l}</th>)}</tr></thead>
          <tbody>
            {leaderIdxs.length === 0 && (
              <tr><td colSpan={EXIT_RAW.reasonLabels.length+1} className="empty-note">No exits recorded for this segment + quarter.</td></tr>
            )}
            {leaderIdxs.map(li => {
              const recs = EXIT_RAW.records.filter(r => r[0]===si && r[1]===qi && r[18]===li);
              const totalTagged = recs.reduce((a,r) => a + r.slice(2,8).reduce((x,y)=>x+y,0), 0);
              return (
                <tr key={li}>
                  <td className="rowlabel">{EXIT_RAW.leaders[li]}</td>
                  {EXIT_RAW.reasonLabels.map((label, ri) => {
                    const sum = recs.reduce((a,rec) => a + rec[2+ri], 0);
                    const pct = totalTagged > 0 ? sum / totalTagged : null;
                    return <td key={label}>{pct===null ? "—" : Math.round(pct*100)+"%"}</td>;
                  })}
                </tr>
              );
            })}
          </tbody>
        </table>
      </div>
    </div>
  );
}

    <div className="card">

      </div>
      <div className="heatmap-scroll">

          <thead><tr><th>Manager</th>{EXIT_RAW.reasonLabels.map(l=><th key={l}>{l}</th>)}</tr></thead>
          <tbody>

              <tr><td colSpan={EXIT_RAW.reasonLabels.length+1} className="empty-note">No exits recorded for this business leader in this segment + quarter.</td></tr>

              const totalTagged = recs.reduce((a,r) => a + r.slice(2,8).reduce((x,y)=>x+y,0), 0);
              return (
                <tr key={mi}>
                  <td className="rowlabel">{EXIT_RAW.managers[mi]}</td>

                    const sum = recs.reduce((a,rec) => a + rec[2+ri], 0);
                    const pct = totalTagged > 0 ? sum / totalTagged : null;
                    return <td key={label}>{pct===null ? "—" : Math.round(pct*100)+"%"}</td>;

function AttritionPage(){
  const [segmentId, setSegmentId] = useState(SEGMENT_REGISTRY[0].id); // Attrition!C4
  const tenureDeptOptions = useMemo(() => Object.keys(ATTR_TENURE[segmentId] || {}), [segmentId]);
  const [tenureDept, setTenureDept] = useState(tenureDeptOptions[0] || "Total"); // Attrition!C30

  useEffect(() => {
    const opts = Object.keys(ATTR_TENURE[segmentId] || {});
    if (!opts.includes(tenureDept)) setTenureDept(opts[0] || "Total");
  }, [segmentId]);

  // Attrition!C76 — Month/Quarter dropdown shared by the Leader Wise and
  // Business Leader -> Manager sections. Options come straight from
  // EXIT_RAW.qtrs, so a new quarter added to the sheet just appears here.
  const [exitQtr, setExitQtr] = useState(EXIT_RAW.qtrs[EXIT_RAW.qtrs.length-1] || "");
  useEffect(() => {
    if (!EXIT_RAW.qtrs.includes(exitQtr)) setExitQtr(EXIT_RAW.qtrs[EXIT_RAW.qtrs.length-1] || "");
  }, []);

  // Business Leaders present for the current segment + quarter — same live
  // derivation used inside LeaderWiseExitTable, so the Attrition!C88
  // dropdown (validated against the Leader Wise table's own leader list in
  // the workbook) always offers exactly the leaders that table shows.
  const exitSi = EXIT_RAW.segs.indexOf(segmentId);
  const exitQi = EXIT_RAW.qtrs.indexOf(exitQtr);
  const businessLeaderOptions = useMemo(() => {
    const set = new Set();
    EXIT_RAW.records.forEach(r => { if (r[0]===exitSi && r[1]===exitQi && r[18]>=0) set.add(r[18]); });
    return [...set].sort((a,b) => EXIT_RAW.leaders[a].localeCompare(EXIT_RAW.leaders[b])).map(i => EXIT_RAW.leaders[i]);
  }, [exitSi, exitQi]);
  const [businessLeader, setBusinessLeader] = useState(businessLeaderOptions[0] || ""); // Attrition!C88
  useEffect(() => {
    if (!businessLeaderOptions.includes(businessLeader)) setBusinessLeader(businessLeaderOptions[0] || "");
  }, [segmentId, exitQtr]);

  const totalDeptKey = Object.keys(ATTR_HEATMAPS.total[segmentId] || {})[0]; // "Total (...)"-style row is always first
  const volDeptKey = Object.keys(ATTR_HEATMAPS.vol[segmentId] || {})[0];
  const latestIdx = ATTR_HEATMAP_PERIODS.length - 1;
  const totalAttrLatest = totalDeptKey ? ATTR_HEATMAPS.total[segmentId][totalDeptKey][latestIdx] : null;
  const volAttrLatest = volDeptKey ? ATTR_HEATMAPS.vol[segmentId][volDeptKey][latestIdx] : null;

  const tier = ATTR_SEG_TIER[segmentId];
  const buckets = TENURE_BUCKETS_BY_TIER[tier];
  const totalTenureRow = (ATTR_TENURE[segmentId] || {})["Total"] || {};
  const latestTenureIdx = TENURE_PERIODS.length - 1;

  return (
    <Shell activeId="attrition" title="Attrition">
      <div className="page-header-row">
        <div>
          <div className="page-title">Attrition</div>
          <div className="page-sub">Select a segment to deep-dive ({ATTR_HEATMAP_PERIODS[latestIdx]})</div>
        </div>
        <div className="filter-group">
          <label htmlFor="attrSegSel">Segment</label>
          <select id="attrSegSel" value={segmentId} onChange={e=>setSegmentId(e.target.value)}>
            {SEGMENT_REGISTRY.map(s => <option key={s.id} value={s.id}>{s.label}</option>)}
          </select>
        </div>
      </div>

      <div className="kpi-row" style={{gridTemplateColumns:`repeat(${2+buckets.length},1fr)`}}>
        <div className="kpi-card"><div className="kpi-label">Total Attr % (Total)</div><div className="kpi-value">{totalAttrLatest===null||totalAttrLatest===undefined?"—":Math.round(totalAttrLatest*100)+"%"}</div></div>
        <div className="kpi-card"><div className="kpi-label">Vol Attr % (Total)</div><div className="kpi-value">{volAttrLatest===null||volAttrLatest===undefined?"—":Math.round(volAttrLatest*100)+"%"}</div></div>
        {buckets.map(b => {
          const v = totalTenureRow[b] ? totalTenureRow[b][latestTenureIdx] : null;
          return (
            <div className="kpi-card" key={b}>
              <div className="kpi-label">{b} months</div>
              <div className="kpi-value" style={{fontSize:22}}>{v===null||v===undefined?"—":Math.round(v*100)+"%"}</div>
            </div>
          );
        })}
      </div>
      <div className="card-caption" style={{marginTop:-10, marginBottom:20}}>Scale: green = low, red = high attrition</div>

      <AttrHeatmap title="Total Attrition % by Dept (heat map)" caption="Scale: green = low, red = high attrition" dataBlock={ATTR_HEATMAPS.total} segmentId={segmentId} />
      <AttrHeatmap title="Voluntary Attrition % by Dept (heat map)" caption="Scale: green = low, red = high attrition" dataBlock={ATTR_HEATMAPS.vol} segmentId={segmentId} />

      <div className="page-header-row" style={{marginTop:4}}>
        <div className="card-caption" style={{margin:0}}>Tenure-wise deep-dive</div>
        <div className="filter-group">
          <label htmlFor="tenureDeptSel">Dept</label>
          <select id="tenureDeptSel" value={tenureDept} onChange={e=>setTenureDept(e.target.value)}>
            {tenureDeptOptions.map(d => <option key={d} value={d}>{d}</option>)}
          </select>
        </div>
      </div>
      <TenureTrendTable segmentId={segmentId} dept={tenureDept} />

      <div className="card-caption" style={{margin:"4px 0 8px", fontWeight:700, color:"#333", fontSize:15}}>Exit Interview Analysis</div>
      <ExitReasonsTable segmentId={segmentId} />
      <LeaderWiseExitTable segmentId={segmentId} qtr={exitQtr} onQtrChange={setExitQtr} />
      <ManagerWiseExitTable segmentId={segmentId} qtr={exitQtr} leader={businessLeader} leaderOptions={businessLeaderOptions} onLeaderChange={setBusinessLeader} />
    </Shell>
  );
}


/* =========================================================================
   APPS SCRIPT INTEGRATION LAYER
   ============================================================================
   This section ONLY swaps the data source. It does not touch any
   rendering, chart, table, heatmap, or aggregation logic anywhere else
   in the file — every function above this point (dualAxisChart,
   ManningPctHeatmap, leaderDeptRows, computeAttendanceMetrics,
   ExitReasonsTable, etc.) keeps reading the exact same module-level
   variable names it always has (RAW, MANNING_DEPT_REGISTRY, PAYROLL_RAW,
   ATTENDANCE_RAW, ENPS_TREND, ATTR_HEATMAPS, ...). Those variables were
   converted from `const` to `let` so this layer can reassign their
   CONTENTS once live data arrives from the Apps Script web app — nothing
   downstream needed to change to consume it.

   HOW TO GO LIVE:
   1. Deploy Code.gs (see its own header comment for deployment steps).
   2. Paste the deployment's web app URL into CONFIG.APPS_SCRIPT_URL below.
   3. Reload the page. Until step 2 is done, the dashboard runs on the
      embedded snapshot captured during the design phase (unchanged
      behavior) — this is intentional so the app keeps working out of
      the box, and so a bad deployment/URL never breaks the UI.
   ========================================================================= */
const CONFIG = {
  APPS_SCRIPT_URL: "https://script.google.com/macros/s/AKfycbyOPp7nEG1sQFni8Oq4sPZxYvS0hs8Mu_is5pOQyDDfK_ixCJU6LNhchUxkuDKZbrLxRA/exec", // <-- paste your Apps Script Web App /exec URL here
};

// Sync status is intentionally simple: idle (no URL configured, running
// on the embedded snapshot), loading, live (hydrated from Apps Script),
// or error (fetch/parse failed — silently keeps the embedded snapshot,
// which is why every page still works even if this step fails).
let DATA_SYNC_LISTENERS = [];
const DATA_SYNC = { status: CONFIG.APPS_SCRIPT_URL ? "loading" : "idle", error: null };
function setSyncStatus_(status, error){
  DATA_SYNC.status = status; DATA_SYNC.error = error || null;
  DATA_SYNC_LISTENERS.forEach(fn => fn());
}
function useSyncStatus(){
  const [, tick] = useState(0);
  useEffect(() => {
    const fn = () => tick(x=>x+1);
    DATA_SYNC_LISTENERS.push(fn);
    return () => { DATA_SYNC_LISTENERS = DATA_SYNC_LISTENERS.filter(f=>f!==fn); };
  }, []);
  return DATA_SYNC;
}

function applyHydratedData_(all){
  // --- Overview ---
  if (all.overview){
    PERIOD_REGISTRY = all.overview.periods;
    LATEST_PERIOD = PERIOD_REGISTRY[PERIOD_REGISTRY.length - 1];
    RAW.manningPct = all.overview.manningPct;
    RAW.manningTarget = all.overview.manningTarget || RAW.manningTarget;
    RAW.headcount = all.overview.headcount;
    RAW.totalAttrPct = all.overview.totalAttrPct;
    RAW.volAttrPct = all.overview.volAttrPct;
    RAW.payrollLakh = all.overview.payrollLakh;
  }
  // --- Manning ---
  if (all.manning){
    MANNING_DEPT_REGISTRY = all.manning.deptRegistry;
    MANNING_PCT_BY_DEPT = all.manning.manningPctByDept;
    HEADCOUNT_BY_DEPT = all.manning.headcountByDept;
    FUNNEL = all.manning.funnel;
  }
  // --- Payroll ---
  if (all.payroll){
    PAYROLL_RAW = all.payroll;
    PAYROLL_MONTHS = PAYROLL_RAW.months;
    PAYROLL_LATEST_MONTH = PAYROLL_MONTHS[PAYROLL_MONTHS.length - 1];
    // Re-derive filter option lists from the freshly hydrated data —
    // these must never be left pointing at the embedded snapshot's lists.
    PAYROLL_HODS = PAYROLL_RAW.hods;
    PAYROLL_DEPTS = PAYROLL_RAW.depts;
    PAYROLL_CATS = PAYROLL_RAW.cats;
    PAYROLL_JOBLEVELS = PAYROLL_RAW.joblevels;
  }
  // --- Attendance ---
  if (all.attendance){
    ATTENDANCE_RAW = all.attendance;
    // Re-derive filter option lists from the freshly hydrated data.
    ATT_SEGS = ATTENDANCE_RAW.segs;
    ATT_DEPTS = ATTENDANCE_RAW.depts;
    ATT_GRADES = ATTENDANCE_RAW.grades;
  }
  // --- eNPS ---
  if (all.enps){
    ENPS_PERIODS = all.enps.periods;
    ENPS_LATEST_PERIOD = ENPS_PERIODS[ENPS_PERIODS.length - 1];
    ENPS_TREND = all.enps.trend;
    ENPS_MIX = all.enps.mix;
    ENPS_RESPONSE_RATE = all.enps.responseRate;
  }
  // --- Attrition ---
  if (all.attrition){
    ATTR_HEATMAPS = { total: all.attrition.total, vol: all.attrition.vol };
    ATTR_TENURE = all.attrition.tenure;
    EXIT_RAW = all.attrition.exit;
  }
  // These are simple aliases to PERIOD_REGISTRY — must be re-pointed at
  // the new array reference after PERIOD_REGISTRY is reassigned above.
  ATTR_HEATMAP_PERIODS = PERIOD_REGISTRY;
  TENURE_PERIODS = PERIOD_REGISTRY;
}

async function hydrateFromAppsScript(){
  if (!CONFIG.APPS_SCRIPT_URL){
    setSyncStatus_("idle", null);
    return;
  }
  setSyncStatus_("loading", null);
  try {
    const res = await fetch(`${CONFIG.APPS_SCRIPT_URL}?page=all`);
    const json = await res.json();
    if (!json.ok) throw new Error(json.error || "Apps Script returned ok:false");
    applyHydratedData_(json.data);
    setSyncStatus_("live", null);
  } catch (err){
    // Fetch/parse failure keeps whatever data is currently loaded (the
    // embedded snapshot on first load) — the dashboard never breaks,
    // it just silently stays on last-known-good data and surfaces a banner.
    setSyncStatus_("error", String(err));
  }
}

function SyncBanner(){
  const sync = useSyncStatus();
  if (sync.status === "idle" || sync.status === "live") return null;
  if (sync.status === "loading"){
    return <div className="empty-note" style={{margin:"0 28px", borderRadius:0}}>Loading live data from Google Sheets…</div>;
  }
  return (
    <div className="empty-note" style={{margin:"0 28px", borderRadius:0}}>
      ⚠ Could not load live data from Apps Script — showing the last known snapshot. ({sync.error})
    </div>
  );
}

/* ============================ APP ROOT ============================ */
function App(){
  const hash = useHashRoute();
  const [, forceRender] = useState(0);
  const [dataTick, setDataTick] = useState(0);

  useEffect(() => {
    if (!AUTH_STATE.loggedIn && hash !== "#/login"){
      navigate("#/login");
    }
  }, [hash]);

  useEffect(() => {
    hydrateFromAppsScript().then(() => setDataTick(t => t+1));
  }, []);

  if (!AUTH_STATE.loggedIn){
    return <LoginPage onLogin={() => forceRender(x=>x+1)} />;
  }

  const path = hash.replace("#/", "") || "overview";
  // key={dataTick} forces a full remount of the current page once live
  // data finishes hydrating, so every component re-reads the freshly
  // reassigned module-level data variables — no per-component prop
  // threading needed, and no change to any page's internal logic.
  const page = (() => {
    if (path === "overview") return <OverviewPage />;
    if (path === "manning") return <ManningPage />;
    if (path === "payroll") return <PayrollPage />;
    if (path === "attendance") return <AttendancePage />;
    if (path === "enps") return <EnpsPage />;
    if (path === "attrition") return <AttritionPage />;
    const nav = NAV_REGISTRY.find(n => n.id === path);
    if (nav) return <StubPage nav={nav} />;
    return <OverviewPage />;
  })();

  return (
    <div key={dataTick}>
      <SyncBanner />
      {page}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
