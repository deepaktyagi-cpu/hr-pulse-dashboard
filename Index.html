<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>HR Pulse — Overview</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
  :root{
    --bg:#f4f3f1; --card:#ffffff; --ink:#1c1c1c; --sub:#6b6b6b; --line:#e8e6e2;
    --amber-bg:#fdf3dd; --amber-ink:#8a6316; --amber-border:#f0dfae;
  }
  *{box-sizing:border-box;}
  html,body,#root{height:100%;}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--ink);}

  /* ---------- Login ---------- */
  .login-screen{min-height:100vh;display:flex;align-items:center;justify-content:center;background:#111;}
  .login-card{background:#fff;border-radius:16px;padding:40px 36px;width:360px;box-shadow:0 20px 60px rgba(0,0,0,.35);}
  .login-brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:18px;margin-bottom:26px;}
  .login-brand .badge{width:30px;height:30px;border-radius:9px;background:#1f9d6b;display:flex;align-items:center;justify-content:center;color:#fff;font-size:15px;}
  .login-field{margin-bottom:16px;}
  .login-field label{display:block;font-size:12px;font-weight:600;color:#555;margin-bottom:6px;}
  .login-field input{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:8px;font-size:14px;}
  .login-btn{width:100%;padding:11px;border:none;border-radius:8px;background:#111;color:#fff;font-weight:600;font-size:14px;cursor:pointer;margin-top:8px;}
  .login-btn:hover{background:#000;}
  .login-note{font-size:11px;color:#999;text-align:center;margin-top:14px;}

  /* ---------- App shell ---------- */
  /* Sidebar removed (V2.1): navigation happens through the Overview
     NavCards + browser back/forward, so the full window width is content. */
  .app{display:flex;min-height:100vh;}
  .brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:15px;}
  .brand .badge{width:26px;height:26px;border-radius:8px;background:#1f9d6b;display:flex;align-items:center;justify-content:center;font-size:13px;color:#fff;}

  .main{flex:1;min-width:0;display:flex;flex-direction:column;}
  .topbar{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:14px 28px;border-bottom:1px solid var(--line);background:var(--bg);position:sticky;top:0;z-index:5;}
  .topbar h2{margin:0;font-size:15px;font-weight:600;}
  .topbar-left{display:flex;align-items:center;gap:14px;min-width:0;}
  .topbar-right{display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:flex-end;}
  .signout{border:1px solid var(--line);background:#fff;padding:6px 14px;border-radius:8px;font-size:13px;cursor:pointer;}
  .home-btn{border:1px solid var(--line);background:#fff;padding:6px 12px;border-radius:8px;font-size:13px;cursor:pointer;display:flex;align-items:center;gap:6px;color:var(--ink);text-decoration:none;}
  .home-btn:hover{background:var(--bg);}
  .crumb-sep{color:var(--sub);}
  .refresh-btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:#fff;padding:6px 14px;border-radius:8px;font-size:13px;cursor:pointer;font-family:inherit;color:var(--ink);}
  .refresh-btn:hover{background:#fafafa;}
  .refresh-btn[disabled]{cursor:progress;opacity:.7;}
  .refresh-btn.ok{border-color:#1f9d6b;color:#1f9d6b;}
  .refresh-btn.err{border-color:#c0392b;color:#c0392b;}
  .refresh-spin{display:inline-block;animation:spin 0.9s linear infinite;}
  @keyframes spin{ from{transform:rotate(0deg);} to{transform:rotate(360deg);} }
  .last-updated{font-size:11px;color:var(--sub);white-space:nowrap;}

  .content{padding:28px;width:100%;max-width:1720px;margin:0 auto;}
  .page-title{font-size:26px;font-weight:700;margin:0 0 4px;}
  .page-sub{color:var(--sub);font-size:13px;margin:0 0 20px;}

  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px 22px;margin-bottom:20px;}
  .card-clickable{cursor:pointer;transition:box-shadow .15s ease, transform .15s ease;}
  .card-clickable:hover{box-shadow:0 6px 20px rgba(0,0,0,.08);transform:translateY(-1px);}
  .card-clickable:focus-visible{outline:2px solid #1f9d6b;outline-offset:2px;}
  .card-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px;}
  .card-title{font-size:13px;font-weight:700;letter-spacing:.03em;text-transform:uppercase;color:#333;}
  .card-arrow{color:#999;font-size:16px;}
  .card-caption{font-size:12px;color:var(--sub);margin:0 0 14px;}

  table{width:100%;border-collapse:collapse;font-size:14px;}
  thead th{text-align:left;font-size:11px;color:var(--sub);text-transform:uppercase;letter-spacing:.03em;font-weight:600;padding:8px 10px;border-bottom:1px solid var(--line);}
  tbody td{padding:12px 10px;border-bottom:1px solid var(--line);}
  tbody tr:last-child td{border-bottom:none;}
  .seg-name{font-weight:700;}
  .muted{color:#a3a3a3;}

  .grid-3{display:grid;grid-template-columns:1.4fr 1.4fr 1fr;gap:20px;}
  .grid-2{display:grid;grid-template-columns:1fr 1fr;gap:20px;}
  .chart-wrap{position:relative;height:190px;margin-bottom:10px;}
  .legend-row{display:flex;flex-wrap:wrap;gap:14px;font-size:11px;color:#444;margin-top:4px;}
  .legend-dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px;}

  .empty-note{display:flex;gap:8px;align-items:flex-start;background:var(--amber-bg);border:1px solid var(--amber-border);color:var(--amber-ink);font-size:13px;border-radius:10px;padding:12px 14px;}

  .list-row{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--line);font-size:14px;}
  .list-row:last-child{border-bottom:none;}
  .list-row b{font-weight:700;}

  .stub-wrap{display:flex;align-items:center;justify-content:center;min-height:60vh;}
  .stub-box{text-align:center;max-width:420px;}
  .stub-box h1{font-size:22px;margin-bottom:8px;}
  .stub-box p{color:var(--sub);font-size:14px;line-height:1.5;}
  .stub-back{margin-top:18px;border:1px solid var(--line);background:#fff;padding:8px 16px;border-radius:8px;font-size:13px;cursor:pointer;}

  /* ---------- Manning page ---------- */
  .page-header-row{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:20px;flex-wrap:wrap;gap:12px;}
  .filter-group{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--sub);}
  .filter-group select{padding:7px 10px;border:1px solid var(--line);border-radius:8px;font-size:13px;background:#fff;color:var(--ink);font-family:inherit;min-width:160px;}
  .kpi-row{display:grid;grid-template-columns:repeat(2,1fr);gap:20px;margin-bottom:20px;}
  .kpi-card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px 20px;}
  .kpi-label{font-size:11px;color:var(--sub);text-transform:uppercase;letter-spacing:.03em;font-weight:600;margin-bottom:6px;}
  .kpi-value{font-size:30px;font-weight:700;}
  .heatmap-scroll{overflow-x:auto;}
  table.heatmap{font-size:13px;}
  table.heatmap th{white-space:nowrap;}
  table.heatmap td{white-space:nowrap;text-align:center;font-weight:600;border-bottom:none;padding:9px 12px;}
  table.heatmap td.rowlabel{text-align:left;font-weight:600;background:#fff;position:sticky;left:0;}
  table.heatmap tbody tr:nth-child(1) td.rowlabel{font-weight:800;}
  .funnel-table td{text-align:center;}
  .funnel-table td.rowlabel{text-align:left;font-weight:700;}

  @media (max-width: 1100px){
    .grid-3{grid-template-columns:1fr;}
    .grid-2{grid-template-columns:1fr;}
    .kpi-row{grid-template-columns:1fr;}
  }
  @media (max-width: 720px){
    .app{flex-direction:column;}
    .brand{display:none;}
    .topbar{flex-wrap:wrap;}
    .content{padding:16px;}
    table{font-size:12px;}
    thead th, tbody td{padding:8px 6px;}
    .page-header-row{flex-direction:column;align-items:stretch;}
  }
  /* ---------- V2 additions (kept minimal, same visual language) ---------- */
  .kpi-row-3{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;margin-bottom:20px;}
  .kpi-row-4{display:grid;grid-template-columns:repeat(4,1fr);gap:20px;margin-bottom:20px;}
  .placeholder-wrap{display:flex;flex-direction:column;gap:14px;}
  .ph-title{font-size:15px;font-weight:700;}
  .ph-sub{font-size:13px;color:var(--sub);line-height:1.55;}
  .ph-skeleton{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:6px;}
  .ph-cell{height:52px;border:1px dashed var(--line);border-radius:10px;background:repeating-linear-gradient(45deg,#fafafa,#fafafa 6px,#f2f2f2 6px,#f2f2f2 12px);}
  .flag-ok{color:#1f9d6b;font-weight:600;}
  .flag-warn{color:#c0392b;font-weight:700;}
  @media (max-width:1100px){ .kpi-row-3,.kpi-row-4{grid-template-columns:1fr;} }
</style>
</head>

/* ============================ FORMATTERS ============================ */
function fmt(kpi, val){
  if (val === null || val === undefined || val === "-" || val === "") return "—";
  switch(kpi.format){
    case "pct0": return Math.round(val*100) + "%";
    case "pct2": return parseFloat((val*100).toFixed(2)) + "%";
    case "int":  return Number(val).toLocaleString("en-IN");
    default:     return val;
  }
}
function fmtPct0(v){ return v===null||v===undefined ? "—" : Math.round(v*100)+"%"; }
function fmtPct1(v){ return v===null||v===undefined ? "—" : parseFloat((v*100).toFixed(1))+"%"; }
function fmtPct2(v){ return v===null||v===undefined ? "—" : parseFloat((v*100).toFixed(2))+"%"; }
function fmtNum1(v){ return v===null||v===undefined ? "—" : (Math.round(v*10)/10).toFixed(1); }
function fmtNum2(v){ return v===null||v===undefined ? "—" : (Math.round(v*100)/100).toFixed(2); }
// Decimal hours -> "7h 54m" - clearer than "7.90" for a working-hours metric.
function fmtHoursMin(v){
  if (v===null||v===undefined) return "—";
  const totalMin = Math.round(v*60);
  const h = Math.floor(totalMin/60), m = totalMin%60;
  return h + "h " + String(m).padStart(2,"0") + "m";
}
function pctTooltip(v, decimals){
  if (v === null || v === undefined) return "—";
  return parseFloat((v*100).toFixed(decimals)) + "%";
}

/* Chronological sort for the workbook's period labels. Handles the
   quarterly labels (JFM'26 / AMJ'26 / JAS'26 / OND'25) and the monthly
   ones (July'26 / Aug'26). Derived, never a hardcoded list. */
const MONTH_ORDER = ["jan","feb","mar","apr","may","jun","jul","aug","sep","oct","nov","dec"];
const QUARTER_ORDER = { jfm:0, amj:3, jas:6, ond:9 };
function periodSortKey(label){
  if (!label) return [9999, 99];
  const m = String(label).match(/^([A-Za-z]+)'?(\d{2,4})$/);
  if (!m) return [9999, 99];
  const name = m[1].toLowerCase(), yr = parseInt(m[2],10);
  const year = yr < 100 ? 2000 + yr : yr;
  if (QUARTER_ORDER[name] !== undefined) return [year, QUARTER_ORDER[name]];
  const mi = MONTH_ORDER.indexOf(name.slice(0,3));
  return [year, mi >= 0 ? mi : 99];
}
/* ---------------------------------------------------------------------
   trimTrailingEmpty - THE single shared helper for period columns.
   The sheet reserves future period columns (Aug'26..Dec'26, Sep'26..Feb'27)
   that are still empty; rendering them produces a wall of "-" cells. Every
   table in this file that renders periods / quarters / months as COLUMNS
   must pass its period array through this helper, together with a callback
   that answers "does ANY row have real data at column index i?".
   Returns the periods up to and including the last one with real data
   (never an empty array - the first column is kept so headers survive).
   Used by: ManningPage (Manning %/Headcount/Recruitment Funnel),
   AttritionPage (Total & Voluntary dept heat maps + both Tenure tables),
   ExitReasonsTable (quarter columns), MonthlyTrendSection (Attendance) and
   OverviewAttendanceTrend. Do NOT re-implement this logic locally.
   ------------------------------------------------------------------- */
function hasValue(v){
  return v !== null && v !== undefined && v !== "" && v !== "#N/A";
}
function trimTrailingEmpty(periods, hasDataAt){
  const arr = periods || [];
  if (!arr.length) return arr;
  for (let i = arr.length - 1; i >= 0; i--){
    if (hasDataAt(i, arr[i])) return arr.slice(0, i + 1);
  }
  return arr.slice(0, 1);
}
/* Convenience: hasDataAt for a list of parallel value-arrays (one per row). */
function anyRowFilled(seriesList){
  return (i) => (seriesList || []).some(s => hasValue((s || [])[i]));
}

function sortPeriods(list){
  return [...list].sort((a,b)=>{
    const ka = periodSortKey(a), kb = periodSortKey(b);
    return ka[0]-kb[0] || ka[1]-kb[1];
  });
}

function useHashRoute(){
  const [hash, setHash] = useState(window.location.hash || "#/login");
  useEffect(() => {
    const onChange = () => setHash(window.location.hash || "#/login");
    window.addEventListener("hashchange", onChange);
    window.addEventListener("popstate", onChange);
    return () => {
      window.removeEventListener("hashchange", onChange);
      window.removeEventListener("popstate", onChange);
    };
  }, []);
  return hash;
}
function navigate(route){ window.location.hash = route; }

/* ============================ COLOUR / CHART HELPERS ============================ */
function lerpColor(a,b,t){
  const c = a.map((v,i)=>Math.round(v + (b[i]-v)*t));
  return "rgb(" + c.join(",") + ")";
}
function scaleColor(v, stops){
  if (v === null || v === undefined) return "transparent";
  if (v <= stops[0][0]) return "rgb(" + stops[0][1].join(",") + ")";
  if (v >= stops[stops.length-1][0]) return "rgb(" + stops[stops.length-1][1].join(",") + ")";
  for (let i=0;i<stops.length-1;i++){
    if (v <= stops[i+1][0]){
      const t = (v-stops[i][0])/(stops[i+1][0]-stops[i][0]);
      return lerpColor(stops[i][1], stops[i+1][1], t);
    }
  }
  return "transparent";
}
/* ONE standardised 3-stop heat-map palette, used by EVERY colour scale in
   this file (Manning %, Headcount, Recruitment Funnel, Attrition, Attendance
   monthly-trend row and the HOD / Dept summary columns). These are the
   Google-Sheets 3-colour-scale defaults - same hue family as the workbook's
   green/yellow/red rules, desaturated to an enterprise-dashboard tone
   (muted terracotta / gold / sage) instead of bright traffic-light candy
   colours, while staying light enough for dark table text.
   Do NOT introduce a second palette anywhere - always go through
   scaleColor() / percentileColor() / manningPctColor() / attrColor(). */
const CF_GREEN  = [134,187,150];   // #86BB96  good  - muted sage
const CF_YELLOW = [240,201,120];   // #F0C978  mid   - warm muted gold
const CF_RED    = [223,143,131];   // #DF8F83  bad   - muted terracotta

/* Per-cell text colour for heat cells. All three stops above are light, so
   dark text wins today, but this is derived from the cell's OWN relative
   luminance rather than assumed - if the palette is ever darkened the text
   flips to white automatically instead of silently failing contrast. */
function heatTextColor(bg){
  const m = /rgb\((\d+),\s*(\d+),\s*(\d+)\)/.exec(bg || "");
  if (!m) return undefined;                        // "transparent" -> inherit
  const srgb = [1,2,3].map(i => {
    const c = Number(m[i]) / 255;
    return c <= 0.03928 ? c/12.92 : Math.pow((c+0.055)/1.055, 2.4);
  });
  const L = 0.2126*srgb[0] + 0.7152*srgb[1] + 0.0722*srgb[2];
  /* Threshold 0.22: all three stops of the palette above clear 6.8:1 against
     #1a1a1a, so they all keep dark text (a mixed white/dark row looks broken);
     white only kicks in if a genuinely dark colour is ever fed in. */
  return L > 0.22 ? "#1a1a1a" : "#ffffff";
}
/* THE single place that turns a heat colour into a <td> style object, so
   every heat cell in this file gets identical background + text handling.
   Never write `style={{background: <colour>}}` for a heat cell - use this. */
function heatStyle(bg){ return { background: bg, color: heatTextColor(bg) }; }

// Manning % — workbook CF Manning!C6:J17: fixed stops 0.7 / 0.9 / 1.0, red->yellow->green
function manningPctColor(v){ return scaleColor(v, [[0.7,CF_RED],[0.9,CF_YELLOW],[1.0,CF_GREEN]]); }
// Attrition % — workbook CF on every Attrition block: fixed stops 0 / 0.15 / 0.4, green->yellow->red
function attrColor(v){ return scaleColor(v, [[0,CF_GREEN],[0.15,CF_YELLOW],[0.4,CF_RED]]); }

/* Percentile scale — mirrors the workbook's cfvo min / percentile-50 / max
   3-colour rules (Manning!L6:T17 headcount, Manning!C21:J25 funnel, and every
   Attendance table row/column). dir=+1 high-good (red->yellow->green),
   dir=-1 high-bad (green->yellow->red). */
function pctStats(values){
  const a = (values||[]).filter(v => typeof v === "number" && isFinite(v)).sort((x,y)=>x-y);
  if (!a.length) return null;
  const mid = a.length % 2 ? a[(a.length-1)/2] : (a[a.length/2-1]+a[a.length/2])/2;
  return { min:a[0], med:mid, max:a[a.length-1] };
}
function percentileColor(v, st, dir){
  if (v===null || v===undefined || typeof v !== "number" || !isFinite(v) || !st) return "transparent";
  if (st.max === st.min) return "rgb(" + CF_YELLOW.join(",") + ")";
  const lo = (dir < 0) ? CF_GREEN : CF_RED;
  const hi = (dir < 0) ? CF_RED : CF_GREEN;
  const stops = (st.med > st.min && st.med < st.max)
    ? [[st.min,lo],[st.med,CF_YELLOW],[st.max,hi]]
    : [[st.min,lo],[st.max,hi]];
  return scaleColor(v, stops);
}
// Headcount by Dept — workbook Manning!L6:T17 = min / p50 / max, high-good
function headcountColor(v, st){ return percentileColor(v, st, +1); }
/* Attendance metric directions: high-good (+1) vs high-bad (-1), matching the
   per-row / per-column CF direction in the Attendance tab. */
const ATT_DIR = { attendancePct:+1, avgPresent:+1, avgHours:+1,
                  avgLeave:-1, avgReport:-1, avgStay:-1, lt8Pct:-1 };

/* ---- Shared axis helpers for every Chart.js scale in this file ----
   Both of these exist to fix two real Chart.js gotchas:
   (1) a percent tick formatter that rounds to whole percent collapses two
       DIFFERENT tick values onto the same label when the data range is tight
       (e.g. 97%-101% manning), so the axis looks like it has duplicate
       "100%" / "99%" labels. Precision is therefore derived from the axis's
       OWN data span.
   (2) two independent y-axes with different tick counts draw two different
       sets of gridlines, so a line can appear to sit on a gridline that
       belongs to the other axis. Every axis here is pinned to the same
       AXIS_TICK_COUNT so gridline row N means "tick N of both axes". */
const AXIS_TICK_COUNT = 6;
function axisRange_(values, beginAtZero, minSpan){
  const a = (values||[]).filter(v => typeof v === "number" && isFinite(v));
  if (!a.length) return null;
  let min = Math.min.apply(null, a), max = Math.max.apply(null, a);
  if (beginAtZero) min = Math.min(0, min);
  let lo, hi;
  if (max === min){                              // flat series - synthesise a band
    const pad = Math.abs(max) * 0.05 || 1;
    lo = beginAtZero ? Math.min(0, min - pad) : min - pad;
    hi = max + pad;
  } else {
    const pad = (max - min) * 0.12;               // breathing room, per-axis
    lo = beginAtZero ? min : min - pad;
    hi = max + pad;
  }
  /* Floor on the total span: a real-world 1-point wobble on a tight range
     (e.g. Manning% for the entry tier sitting between 99-101%) should read
     as a modest wobble, not a dramatic top-to-bottom swing. Without this,
     axisRange_'s 12% padding zooms in so far on a naturally tiny spread
     that a 1pp change fills almost the whole chart height - technically
     correct per-axis, but visually misleading. Expand symmetrically around
     the data's own center to reach the floor, only when the natural span
     is already narrower than it. */
  if (minSpan && (hi - lo) < minSpan){
    const center = (hi + lo) / 2;
    let newLo = center - minSpan/2, newHi = center + minSpan/2;
    if (beginAtZero && newLo < 0){ newHi += -newLo; newLo = 0; }
    lo = newLo; hi = newHi;
  }
  return { min: lo, max: hi };
}
/* Adaptive precision: <5 percentage points of span -> 1 decimal place, so
   ticks never collide onto an identical label. */
function pctTickCallback_(range){
  const span = range ? (range.max - range.min) : 1;
  const dec  = (span < 0.05) ? 1 : 0;
  return function(v){ return (v * 100).toFixed(dec) + "%"; };
}
function numTickCallback_(range){
  const span = range ? (range.max - range.min) : 1;
  const dec  = (span < 5) ? 1 : 0;
  return function(v){ return (typeof v === "number") ? Number(v.toFixed(dec)) : v; };
}
function axisScale_(position, titleText, range, isPercent, extra){
  const sc = {
    position: position,
    grid: (extra && extra.grid) || undefined,
    ticks: {
      count: AXIS_TICK_COUNT,
      font: { size: 10 },
      callback: isPercent ? pctTickCallback_(range) : numTickCallback_(range),
    },
    title: { display: true, text: titleText, font: { size: 10 } },
  };
  if (range){ sc.min = range.min; sc.max = range.max; }
  return sc;
}

/* Dual-axis segment line chart - identical component to the approved
   build (MS segments left axis, entry segments right axis). Each axis gets
   its OWN min/max computed from its OWN segments' data, so entry-level lines
   are never squashed onto the bottom of a scale dictated by the left axis. */
function useLineChart(canvasRef, sourceBlock, periods, opts){
  const o = opts || {};
  const isPercent = o.isPercent, dashedExtra = o.dashedExtra, pctDecimals = o.pctDecimals || 0;
  const beginAtZero = o.beginAtZero !== false; // default true - matches the sheet's native charts
  useEffect(() => {
    if (!canvasRef.current) return;
    const datasets = SEGMENT_REGISTRY.map(seg => ({
      label: seg.label,
      data: periods.map(p => sourceBlock && sourceBlock[p] ? sourceBlock[p][seg.id] : null),
      borderColor: seg.color, backgroundColor: seg.color,
      yAxisID: seg.axisTier === "MS" ? "yLeft" : "yRight",
      tension: 0, pointRadius: 3, spanGaps: true,
    }));
    if (dashedExtra){
      datasets.push({
        label: dashedExtra.label,
        data: periods.map(p => dashedExtra.source ? dashedExtra.source[p] : null),
        borderColor:"#9CA3AF", borderDash:[5,4], pointRadius:0, yAxisID:"yLeft", tension:0, spanGaps:true,
      });
    }
    /* Per-axis ranges from that axis's OWN datasets (the dashed Target line
       belongs to yLeft, so it counts towards the left range only). */
    const collect = (tier) => {
      const out = [];
      datasets.forEach(ds => {
        const onLeft = ds.yAxisID === "yLeft";
        if ((tier === "left") !== onLeft) return;
        ds.data.forEach(v => out.push(v));
      });
      return out;
    };
    // For percent axes, never let the visible span collapse below 3
    // percentage points - see axisRange_'s comment on why.
    const minSpan = isPercent ? 0.03 : undefined;
    const leftRange  = axisRange_(collect("left"),  beginAtZero, minSpan);
    const rightRange = axisRange_(collect("right"), beginAtZero, minSpan);
    const chart = new Chart(canvasRef.current, {
      type: "line",
      data: { labels: periods, datasets },
      options: {
        responsive:true, maintainAspectRatio:false,
        plugins:{
          legend:{ display:false },
          tooltip:{ callbacks:{ label:(ctx)=>{
            const v = ctx.parsed.y;
            return ctx.dataset.label + ": " + (isPercent ? pctTooltip(v, pctDecimals) : v);
          }}}
        },
        scales:{
          yLeft:  axisScale_("left",  "Mid & Senior Level", leftRange,  isPercent),
          yRight: axisScale_("right", "Entry Level",        rightRange, isPercent, { grid:{ drawOnChartArea:false } }),
          x:{ ticks:{ font:{size:10} } },
        }
      }
    });
    return () => chart.destroy();
  }, [canvasRef, sourceBlock, periods, isPercent, dashedExtra, pctDecimals, beginAtZero]);
}
function Legend({ extra }){
  return (
    <div className="legend-row">
      {SEGMENT_REGISTRY.map(s => (
        <span key={s.id}><span className="legend-dot" style={{background:s.color}}></span>{s.label}</span>
      ))}
      {extra && <span><span className="legend-dot" style={{background:"#9CA3AF"}}></span>{extra}</span>}
    </div>
  );
}
function TrendChart({ sourceBlock, periods, isPercent, dashedExtra, pctDecimals, beginAtZero }){
  const ref = useRef(null);
  useLineChart(ref, sourceBlock, periods, { isPercent, dashedExtra, pctDecimals: pctDecimals || 0, beginAtZero });
  return <div className="chart-wrap"><canvas ref={ref}></canvas></div>;
}

/* Generic multi-series line chart (Attendance monthly trends, where the
   series are metrics / HODs rather than segments). */
const SERIES_PALETTE = ["#F28E2B","#4E79A7","#E15759","#59A14F","#76B7B2","#EDC948","#B07AA1","#FF9DA7","#9C755F","#BAB0AC","#2563EB","#7C3AED","#059669","#DC2626","#D97706","#0891B2"];
function MultiLineChart({ labels, series, isPercent, pctDecimals, height }){
  const ref = useRef(null);
  const dec = pctDecimals || 0;
  useEffect(() => {
    if (!ref.current) return;
    const chart = new Chart(ref.current, {
      type:"line",
      data:{ labels, datasets: series.map((s,i)=>({
        label:s.label, data:s.data,
        borderColor: s.color || SERIES_PALETTE[i % SERIES_PALETTE.length],
        backgroundColor: s.color || SERIES_PALETTE[i % SERIES_PALETTE.length],
        tension:0, pointRadius:3, spanGaps:true,
      }))},
      options:{
        responsive:true, maintainAspectRatio:false,
        plugins:{
          legend:{ display:true, position:"bottom", labels:{ boxWidth:8, boxHeight:8, font:{size:10}, usePointStyle:true } },
          tooltip:{ callbacks:{ label:(ctx)=> ctx.dataset.label + ": " + (isPercent ? pctTooltip(ctx.parsed.y, dec) : fmtNum2(ctx.parsed.y)) }}
        },
        scales:{
          y: (function(){
               const all = [];
               series.forEach(sr => (sr.data||[]).forEach(v => all.push(v)));
               const range = axisRange_(all, true);
               const sc = { beginAtZero:true,
                            ticks:{ count:AXIS_TICK_COUNT, font:{size:10},
                                    callback: isPercent ? pctTickCallback_(range) : numTickCallback_(range) } };
               if (range){ sc.min = range.min; sc.max = range.max; }
               return sc;
             })(),
          x:{ ticks:{ font:{size:10} } },
        }
      }
    });
    return () => chart.destroy();
  }, [labels, series, isPercent, dec]);
  return <div className="chart-wrap" style={{height: height || 210}}><canvas ref={ref}></canvas></div>;
}

/* =========================================================================
   OVERVIEW PAGE
   Scorecard = Overview!B6:I11 "Overall_view - Latest (July'26)".
     C..F  -> Data!B593:E611 summary rows (via OVERVIEW.* period blocks)
     G,H   -> literal "-" in the sheet (eNPS / Cost, yet to track)
     I     -> Attendance_Data SUMIFS(Present)/SUMIFS(Total) for the
              latest month, replicated client-side by attendanceMetrics()
   Below the scorecard, the same clickable NavCard grid as the approved
   build: Manning (2 trends), Attrition (2 trends), eNPS (empty state),
   then Attendance (real monthly trend) + Payroll / Cost empty states.
   ========================================================================= */
/* Attendance % per segment comes from the sheet's own Overall_view cells,
   served by the backend (overviewSheetAttendance_). It is NOT recomputed
   from the raw attendance rows: the sheet's formulas use their own row
   ranges, and any cell the sheet leaves blank must render blank here too
   rather than being replaced by a locally-computed number. */
function overviewAttendanceBySegment(){
  const src = (OVERVIEW && OVERVIEW.attendanceBySegment) || {};
  const out = {};
  SEGMENT_IDS.forEach(seg => {
    const v = src[seg];
    out[seg] = (v === undefined || v === null || v === "") ? null : v;
  });
  return out;
}

function Scorecard(){
  const attBySeg = useMemo(() => overviewAttendanceBySegment(), []);

  const sources = {
    manningPct:    OVERVIEW.manningPct,
    headcount:     OVERVIEW.headcount,
    totalAttrPct:  OVERVIEW.totalAttrPct,
    volAttrPct:    OVERVIEW.volAttrPct,
    attendancePct: null,        // resolved directly from attBySeg below
  };
  // Each KPI resolves its own "latest" from its own period list, because
  // Manning/Attrition are quarterly (July'26) while Attendance is monthly
  // (Aug'26). Never hardcoded - always the last key of that block.
  function latestKeyFor(id){
    const src = sources[id];
    if (!src) return null;
    const keys = sortPeriods(Object.keys(src));
    return keys[keys.length - 1];
  }
  return (
    <div className="card">
      <div className="card-head">
        <div className="card-title">Overall_view &mdash; Latest ({LATEST_PERIOD})</div>
      </div>
      <div className="card-caption">
        Manning / Attrition as of {LATEST_PERIOD} (quarterly) &middot; Attendance as reported in the workbook.
        eNPS and Cost are not tracked yet. A dash means the workbook has no value for that cell.
      </div>
      <div className="heatmap-scroll">
        <table>
          <thead>
            <tr>
              <th>Segment</th>
              {KPI_REGISTRY.map(k => <th key={k.id}>{k.label}</th>)}
            </tr>
          </thead>
          <tbody>
            {SEGMENT_REGISTRY.map(seg => (
              <tr key={seg.id}>
                <td className="seg-name">{seg.label}</td>
                {KPI_REGISTRY.map(kpi => {
                  if (!kpi.isLive) return <td key={kpi.id} className="muted">-</td>;
                  if (kpi.id === "attendancePct"){
                    const av = attBySeg[seg.id];
                    return <td key={kpi.id} className={av===null ? "muted" : ""}>{av===null ? "\u2014" : fmtPct2(av)}</td>;
                  }
                  const src = sources[kpi.id];
                  const key = latestKeyFor(kpi.id);
                  const val = src && key && src[key] ? src[key][seg.id] : null;
                  return <td key={kpi.id}>{fmt(kpi, val)}</td>;
                })}
              </tr>
            ))}
          </tbody>
        </table>
      </div>
    </div>
  );
}

/* All 7 attendance metrics, exactly as the workbook's Overview attendance
   table holds them (Metric x period). Served by the backend straight off
   the sheet, so a blank cell in the sheet stays blank here - no value is
   ever synthesised. "Avg Working Hours" arrives already converted from the
   sheet's TIME storage into decimal hours. */
function fmtAttMetric(m, v){
  if (v === null || v === undefined || v === "") return "\u2014";
  if (m.isPct) return fmtPct2(v);
  if (/working hours/i.test(m.label)) return fmtHoursMin(v);
  return fmtNum2(v);
}
function OverviewAttendanceTrend(){
  /* Fall back to the embedded snapshot if a live payload arrived without the
     attendance block (older backend deployment) - otherwise this table would
     silently render as headers-only with no rows. */
  let trend = (OVERVIEW && OVERVIEW.attendanceTrend) || null;
  if (!trend || !(trend.metrics || []).length) trend = (SNAP.overview && SNAP.overview.attendanceTrend) || { periods: [], metrics: [] };
  const allLabels = trend.periods || [];
  const metrics   = trend.metrics || [];
  // Same shared helper: drop the reserved future months with no values at all.
  const labels = trimTrailingEmpty(allLabels,
    (i) => metrics.some(m => hasValue((m.values || [])[i])));
  const pctRow  = metrics.find(m => m.isPct && /attendance/i.test(m.label));
  const series  = pctRow ? [{
    label: pctRow.label,
    data: labels.map((_,i) => {
      const v = pctRow.values[i];
      return (v === undefined || v === "") ? null : v;
    }),
    color: "#1f9d6b",
  }] : [];

  return (
    <>
      {series.length > 0 && <MultiLineChart labels={labels} series={series} isPercent={true} height={170} />}
      <div className="heatmap-scroll" style={{marginTop:10}}>
        <table>
          <thead>
            <tr>
              <th>Metric</th>
              {labels.map(l => <th key={l} style={{textAlign:"right"}}>{l}</th>)}
            </tr>
          </thead>
          <tbody>
            {metrics.map(m => (
              <tr key={m.key}>
                <td style={{fontWeight:600}}>{m.label}</td>
                {labels.map((l,i) => {
                  const v = m.values[i];
                  const blank = (v === null || v === undefined || v === "");
                  return <td key={l} className={blank ? "muted" : ""} style={{textAlign:"right"}}>{fmtAttMetric(m, v)}</td>;
                })}
              </tr>
            ))}
          </tbody>
        </table>
      </div>
      <div className="card-caption" style={{marginTop:8}}>
        Company-wide, all segments. A dash means the workbook has no value for that month.
      </div>
    </>
  );
}

/* =========================================================================
   MANNING PAGE
   Mirrors the Manning tab: Manning!O2 segment selector drives both heat
   maps; a separate dept selector scopes the recruitment funnel only
   (exactly the workbook's two independent dropdowns).
   Sources: Data!"DEEP MANNING" / "DEEP HEADCOUNT" / "RECRUITMENT FUNNEL".
   Period columns come from those blocks' own header row - quarterly, and
   including the empty future columns (Aug'26..Dec'26) so a new quarter
   appears the moment it is filled in.
   ========================================================================= */
function HeatmapTable({ title, caption, depts, periods, dataBySeg, colorFn, fmtFn, minMax }){
  const rows = depts || [];
  /* minMax (percentile) scale is computed PER ROW - min/median/max of that
     dept's own values across periods - exactly like the Recruitment Funnel
     table and the sheet's own per-row CF. A single global scale across every
     dept+period was wrong: a flat/constant row (e.g. Design = 5,5,5) would
     get pinned to red just because 5 is the smallest number anywhere in the
     whole table, even though the row itself never changes. Colour should
     read left-to-right (that row's own trend), not top-to-bottom (rank vs.
     other depts). */
  return (
    <div className="card">
      <div className="card-head"><div className="card-title">{title}</div></div>
      {caption && <div className="card-caption">{caption}</div>}
      <div className="heatmap-scroll">
        <table className="heatmap">
          <thead><tr><th>Dept</th>{periods.map(p => <th key={p}>{p}</th>)}</tr></thead>
          <tbody>
            {rows.map(d => {
              const rowVals = (dataBySeg[d] || []);
              const rowStats = minMax ? pctStats(rowVals) : null;
              return (
                <tr key={d}>
                  <td className="rowlabel">{d}</td>
                  {periods.map((p,i) => {
                    const v = rowVals[i];
                    const num = (v===null||v===undefined||v==="#N/A") ? null : v;
                    return <td key={p} style={heatStyle(minMax ? colorFn(num, rowStats) : colorFn(num))}>{fmtFn(num)}</td>;
                  })}
                </tr>
              );
            })}
          </tbody>
        </table>
      </div>
    </div>
  );
}

function fmtFunnel(metric, val){
  if (val === null || val === undefined || val === "#N/A") return "—";
  if (typeof val === "string") return val;                       // ratio strings like "1:4"
  if (/%/.test(metric)) return Math.round(val*100) + "%";
  return val;
}

function RecruitmentFunnel({ segmentId, dept, periods: periodsProp }){
  const periods = periodsProp || MANNING.periods;
  const metrics = MANNING.funnelMetrics;
  const block = (MANNING.funnel[segmentId] || {})[dept] || {};
  return (
    <div className="card">
      <div className="card-head"><div className="card-title">Recruitment Funnel &mdash; {dept}</div></div>
      <div className="card-caption">Recruitment funnel, scoped to the selected segment &amp; dept.</div>
      <div className="heatmap-scroll">
        <table className="heatmap funnel-table">
          <thead><tr><th>Metric</th>{periods.map(p => <th key={p}>{p}</th>)}</tr></thead>
          <tbody>
            {metrics.map(m => {
              /* Workbook CF Manning!C21:J25 = min / percentile-50 / max,
                 red->yellow->green, applied per metric row. The
                 "Sourcing:Selection Ratio" row is a text ratio -> no heat. */
              const vals = periods.map((p,i) => (block[m]||[])[i]);
              const st = /Ratio/i.test(m) ? null : pctStats(vals);
              return (
                <tr key={m}>
                  <td className="rowlabel">{m}</td>
                  {periods.map((p,i) => (
                    <td key={p} style={heatStyle(percentileColor(vals[i], st, +1))}>{fmtFunnel(m, vals[i])}</td>
                  ))}
                </tr>
              );
            })}
          </tbody>
        </table>
      </div>
    </div>
  );
}

function ManningPage(){

  const funnelDepts = Object.keys(MANNING.funnel[segmentId] || {});
  const [dept, setDept] = useState(funnelDepts[0] || "Total");
  useEffect(() => { setDept(funnelDepts[0] || "Total"); }, [segmentId]);

  const allPeriods = MANNING.periods;
  const totalRow = MANNING.manningPctByDept[segmentId] || {};
  const hcRow = MANNING.headcountByDept[segmentId] || {};
  /* Only show period columns up to the latest one that actually has data
     anywhere on this page (Manning %, Headcount by dept, or the funnel) -
     the DEEP blocks carry empty future quarters, which would otherwise
     render as a wall of "-". Shared helper, same one the Attrition and
     Attendance pages use. */
  const funnelBlock = (MANNING.funnel[segmentId] || {})[dept] || {};
  const manningSeries = [];
  depts.forEach(d => { manningSeries.push(totalRow[d] || [], hcRow[d] || []); });

  const lastFilled = Math.max(0, trimTrailingEmpty(periods, anyRowFilled([totalRow["Total"] || []])).length - 1);

  return (
    <Shell activeId="manning" title="Manning">
      <div className="page-header-row">
        <div>
          <div className="page-title">Manning</div>
          <div className="page-sub">Manning % &amp; headcount by department &middot; {periods[0]} &rarr; {periods[lastFilled]}</div>
        </div>
        <div style={{display:"flex", gap:14, flexWrap:"wrap"}}>
          <SegmentSelect id="manSegSel" label="Select Segment &rarr;" value={segmentId} onChange={setSegmentId} />
        </div>
      </div>

      <div className="kpi-row">
        <div className="kpi-card">
          <div className="kpi-label">Manning % ({periods[lastFilled]})</div>
          <div className="kpi-value">{fmtPct0((totalRow["Total"]||[])[lastFilled])}</div>
        </div>
        <div className="kpi-card">
          <div className="kpi-label">Headcount ({periods[lastFilled]})</div>
          <div className="kpi-value">{(hcRow["Total"]||[])[lastFilled] != null ? Number((hcRow["Total"])[lastFilled]).toLocaleString("en-IN") : "—"}</div>
        </div>
      </div>

      <div className="grid-2">
        <HeatmapTable title="Manning % by Dept (heat map)"
          caption="Scale: red = under-manned, green = at/over target. Same CF stops as the workbook (0.7 / 0.9 / 1.0)."
          depts={depts} periods={periods} dataBySeg={totalRow} colorFn={manningPctColor} fmtFn={fmtPct0} />

        <HeatmapTable title="Headcount by Dept (heat map)"
          caption="Red &rarr; yellow &rarr; green on that dept's own min / median / max headcount across periods."
          depts={depts} periods={periods} dataBySeg={hcRow} colorFn={headcountColor} minMax={true}
          fmtFn={(v)=> v===null||v===undefined ? "—" : Number(v).toLocaleString("en-IN")} />

      <div className="page-header-row" style={{marginTop:4, marginBottom:4, alignItems:"center"}}>
        <div className="card-caption" style={{margin:0}}>Recruitment funnel deep-dive &middot; {dept}</div>

      </div>

/* =========================================================================
   ATTRITION PAGE
   Mirrors the Attrition tab: Attrition!O2 segment selector drives the two
   dept heat maps; Attrition!O3-equivalent dept selector scopes the
   tenure-wise trend. Tenure buckets are per-segment-tier and come from
   the workbook's own bucket labels (SaaS_MS/MP_MS = 0_6/6_12/12_24/24+,
   entry = 0_3/3_6/6_12/12+) - read from the data, not hardcoded.
   Sources: Data!"DEEP TotAttr", "DEEP VolAttr", the two
   "Tenure-wise ..." blocks, and Exit_Data for the exit-interview tables.
   ========================================================================= */
function TenureTable({ title, dept, periods, buckets, blockBySeg, wip }){
  const anyData = buckets.some(b => (blockBySeg[b]||[]).some(v => typeof v === "number" && isFinite(v)));
  return (
    <div className="card">
      <div className="card-head"><div className="card-title">{title} &mdash; {dept}</div></div>
      <div className="card-caption">Attrition % per tenure bucket, in months.</div>
      {(wip || !anyData)
        ? <div className="empty-note">&#9888; WIP &mdash; tenure-wise data for this table will be added once available; this card will populate automatically, no rebuild needed.</div>
        : <div className="heatmap-scroll">
            <table className="heatmap">
              <thead><tr><th>Bucket</th>{periods.map(p => <th key={p}>{p}</th>)}</tr></thead>
              <tbody>
                {buckets.map(b => (
                  <tr key={b}>
                    <td className="rowlabel">{b}</td>
                    {periods.map((p,i) => {
                      // Defensive: the sheet's own tenure formula is
                      // IFERROR(...,NA()) - an explicit "no data for this
                      // bucket/period" marker, not a real error - so any
                      // non-finite-number value (stray "#N/A" text etc.)
                      // renders as the same "-" as every other blank cell
                      // instead of leaking literal error text into the UI.
                      const raw = (blockBySeg[b]||[])[i];
                      const v = (typeof raw === "number" && isFinite(raw)) ? raw : null;
                      return <td key={p} style={heatStyle(attrColor(v))}>{fmtPct1(v)}</td>;
                    })}
                  </tr>
                ))}
              </tbody>
            </table>
          </div>}
    </div>
  );
}

/* Exit_Data derived tables. Columns of each record:
   [seg, qtr, dept(Valid_Dept.), leader(BL_name), manager(L2_name), exitType, ...reasonCounts] */
const EXIT_REASON_OFFSET = 6;
function exitRows({ seg, qtr, dept, leader, voluntaryOnly }){
  // dept="Total" (or no dept passed) means no dept filter - Exit_Data's own
  // Valid_Dept. column never contains the literal value "Total", so this is
  // an aggregate the dashboard computes, matching how every other "Total"
  // row on this page is a roll-up rather than a literal filter value.
  return ATTRITION.exit.records.filter(r =>
    (!seg || r[0] === seg) && (!qtr || r[1] === qtr) &&
    (!dept || dept === "Total" || r[2] === dept) &&
    (!leader || r[3] === leader) &&
    (!voluntaryOnly || String(r[5]||"").trim().toLowerCase() === "voluntary"));
}
function reasonTotals(rows){
  const labels = ATTRITION.exit.reasonLabels;
  const out = labels.map(() => 0);
  rows.forEach(r => labels.forEach((_,i) => { out[i] += (r[EXIT_REASON_OFFSET+i] || 0); }));
  return out;
}
/* The workbook shows these tables as SHARE-OF-MENTIONS, not raw counts:
   Attrition!C34 = SUMIFS(Exit_Data r_<reason>) / SUMIFS(Exit_Data!$AD
   (= per-row SUM of all six r_* flags)), i.e. each reason count divided by
   the TOTAL of all reason mentions in the same slice. For the quarter-trend
   table the slice is the quarter COLUMN (each column sums to 100%); for the
   Leader / Manager tables (Attrition!C43, C54) the slice is the leader /
   manager ROW (each row sums to 100%). Zero mentions -> nulls, so the cells
   render as the same "-" used for every other blank in this file instead of
   a 0/0 NaN. */
function reasonShares(counts){
  const sum = (counts || []).reduce((a,b) => a + (b || 0), 0);
  return (counts || []).map(c => sum > 0 ? (c || 0) / sum : null);
}
/* Workbook consolidated the Exit Interview section down to ONE table pair
   (Attrition!B30/L30), now filtered by the SAME "Select Segment Dept."
   dropdown that scopes the Tenure-wise tables (Attrition!$O$19 - one shared
   cell, referenced by both Tenure!C22 and this table's Exit_Data!$U SUMIFS)
   - the separate Business-Leader / Leader-wise / Manager-wise roll-up tables
   that used to exist here are gone from the sheet entirely. Rows are
   quarters (not reasons) and the % share is PER QUARTER ROW (each quarter
   sums to 100% of that dept's mentions that quarter). "Total" is a
   dashboard-side aggregate (see exitRows) since Exit_Data's own Valid_Dept.
   column never literally contains "Total". */
function ExitReasonsTable({ segmentId, dept, voluntaryOnly, title }){
  const qtrs = sortPeriods(ATTRITION.exit.qtrs);
  const labels = ATTRITION.exit.reasonLabels;
  const allRows = qtrs.map(q => reasonTotals(exitRows({ seg:segmentId, qtr:q, dept, voluntaryOnly })));
  const anyData = allRows.some(row => row.some(v => v > 0));
  // Drop trailing quarters the sheet reserves but has no exit records for.
  const shownQtrs = trimTrailingEmpty(qtrs, (i) => allRows[i].some(v => v > 0));
  // Share-of-mentions PER QUARTER ROW - each row sums to ~100%.
  const shares = shownQtrs.map((q, i) => reasonShares(allRows[i]));
  if (!anyData){
    return (
      <div className="card">
        <div className="card-head"><div className="card-title">{title}</div></div>
        <div className="empty-note">No exit-interview records in Exit_Data for {segmentId}{dept && dept !== "Total" ? " / " + dept : ""}.</div>
      </div>
    );
  }
  return (
    <div className="card">
      <div className="card-head"><div className="card-title">{title}</div></div>
      <div className="card-caption">
        Share of all exit-reason mentions in each quarter (Exit_Data r_* flags &divide; that quarter&rsquo;s
        total mentions for {dept || "Total"} &mdash; each row sums to 100%). Colour scale:
        green = low, red = high share, same 0 / 15% / 40% stops as the workbook&rsquo;s conditional format.
      </div>
      <div className="heatmap-scroll">
        <table className="heatmap">
          <thead><tr><th>Quarter</th>{labels.map(l => <th key={l}>{l}</th>)}</tr></thead>
          <tbody>
            {shownQtrs.map((q, qi) => (
              <tr key={q}>
                <td className="rowlabel">{q}</td>
                {labels.map((lab, li) => (
                  <td key={lab} style={heatStyle(attrColor(shares[qi][li]))}>{fmtPct1(shares[qi][li])}</td>
                ))}
              </tr>
            ))}
          </tbody>
        </table>
      </div>
    </div>
  );
}

function AttritionPage(){
  const [segmentId, setSegmentId] = useState(SEGMENT_REGISTRY[0].id);   // Attrition!O2
  const depts = ATTRITION.deptRegistry[segmentId] || [];
  const tenureDepts = Object.keys(ATTRITION.tenureTotal[segmentId] || {});
  const [tenureDept, setTenureDept] = useState(tenureDepts[0] || "Total");
  // tenureDept (Attrition!$O$19 - "Select Segment Dept.") now scopes BOTH
  // the Tenure-wise tables AND the Exit Interview Analysis table below them
  // - the sheet's Exit_Data!$U SUMIFS in Attrition!C32 references the same
  // $O$19 cell the Tenure formulas do, so there is only one dropdown, not a
  // separate Business Leader one any more.
  useEffect(() => { setTenureDept(tenureDepts[0] || "Total"); }, [segmentId]);

  const allPeriods = ATTRITION.periods;
  const tot = ATTRITION.total[segmentId] || {};

  return (

        </div>
        <div className="kpi-card">
          <div className="kpi-label">Voluntary Attrition % ({periods[lastFilled]})</div>
          <div className="kpi-value">{fmtPct1((vol["Total"]||[])[lastFilled])}</div>
        </div>
      </div>

      <div className="grid-2">
        <HeatmapTable title="Total Attrition % by Dept (heat map)"
          caption="Scale: green = low, red = high attrition."
          depts={depts} periods={periods} dataBySeg={tot} colorFn={attrColor} fmtFn={fmtPct1} />
        <HeatmapTable title="Voluntary Attrition % by Dept (heat map)"
          caption="Scale: green = low, red = high attrition."
          depts={depts} periods={periods} dataBySeg={vol} colorFn={attrColor} fmtFn={fmtPct1} />
      </div>

      <div className="page-header-row" style={{marginTop:4, marginBottom:4, alignItems:"center"}}>
        <div className="card-caption" style={{margin:0}}>Tenure-wise attrition deep-dive &middot; {tenureDept}</div>
        <OptionSelect id="tenureDeptSel" label="Select Segment Dept. &rarr;" value={tenureDept} onChange={setTenureDept} options={tenureDepts} />
      </div>
      <div className="grid-2">
        <TenureTable title="Tenure-wise Total Attrition — Dept. x Age Cohort (trend)" dept={tenureDept}
          periods={periods} buckets={tenureBuckets}
          blockBySeg={tenTotBlock} />
        <TenureTable title="Tenure-wise Voluntary Attrition — Dept. x Age Cohort (trend)" dept={tenureDept}
          periods={periods} buckets={tenureBuckets}
          blockBySeg={tenVolBlock} />

      <div className="card-caption" style={{margin:"4px 0 8px", fontWeight:700, color:"#333", fontSize:15}}>
        Exit Interview Analysis &middot; {tenureDept} <span style={{fontWeight:400, color:"#888"}}>(uses the Select Segment Dept. filter above)</span>
      </div>
      <div className="grid-2">
        <ExitReasonsTable segmentId={segmentId} dept={tenureDept} title="Top reasons for leaving Total Exits — trend (mentions per quarter)" />
        <ExitReasonsTable segmentId={segmentId} dept={tenureDept} voluntaryOnly={true} title="Top reasons for leaving Voluntary Exits — trend (mentions per quarter)" />
      </div>

  );

/* =========================================================================
   ATTENDANCE PAGE
   ============================================================================
   Every metric below is a 1:1 client-side replication of the formulas on
   the workbook's Attendance tab (and Overview rows 70-76), read directly
   out of HR_DB_final_July26_V3_validated.xlsx. Users will cross-check the
   two side by side, so the definitions are copied literally rather than
   "improved":

   Record layout (ATTENDANCE.records), one row per employee-month:
     [0] monthIdx  -> ATTENDANCE.months   (Attendance_Data col A)
     [1] segIdx    -> ATTENDANCE.segs     (col J,  Segment)
     [2] hodIdx    -> ATTENDANCE.hods     (col T,  HOD_name)
     [3] deptIdx   -> ATTENDANCE.depts    (Canonical_Department if that
                     helper column exists, else Valid_department (col S),
                     else Department (col E) - canonicalised either way;
                     resolved BY HEADER NAME in Code_V2.gs, never by index)
     [4] gradeIdx  -> ATTENDANCE.grades   (col G,  Grade)
     [5] present   (col K, Present_Days)
     [6] absent    (col L, Absent_Days)
     [7] leave     (col M, Leave_Days)
     [8] total     (col N, Total_Days)
     [9] report11  (col O, Reporting_After_1115_Days)
     [10] stay19   (col P, Staying_After_1915_Days)
     [11] lt8Flag  (col Q, "Employees < 8 Hr Flag" -> 1 if "Yes" else 0)
     [12] hours    (col R, Avg Working Hours -> DECIMAL HOURS)

   FORMULA MAPPING (verified cell-by-cell against the sheet):
     Attendance %          Attendance!C6  = SUMIFS(K)/SUMIFS(N)
     Avg Present Days      Attendance!C7  = AVERAGEIFS(K)
     Avg Leave Days        Attendance!C8  = AVERAGEIFS(M)
     Avg Working Hours     Attendance!C9  = AVERAGEIFS(R)
     Avg Report >11AM      Attendance!C10 = AVERAGEIFS(O)
     Avg Stay >7:15PM      Attendance!C11 = AVERAGEIFS(P)
     <8Hr Emp %            Attendance!C12 = COUNTIFS(Q="Yes") / COUNTIFS(all)
     Flag                  Attendance!J17 = IF(OR(Att%<0.85, <8Hr%>0.3), "Review", "OK")

   TWO SUBTLETIES REPLICATED EXACTLY (do not "simplify" these):
   1. AVERAGEIFS skips BLANK cells but INCLUDES zeros. So the averages
      divide by the count of NON-NULL values in that specific column - the
      denominator differs per metric, and is NOT the row count. mean_()
      below does precisely that.
   2. The <8Hr Emp % denominator is COUNTIFS over ALL matching rows (no
      criterion on col Q at all), so blank/absent flag cells still count
      in the denominator. lt8Pct uses rows.length, not the non-null count.

   3. Attendance_Data col R is stored in the sheet as a TIME value, so
      the sheet DISPLAYS "09:05" while the row label says "(decimal)".
      The extract converts it to decimal hours (9.10) once, here, so the
      dashboard shows a real number. 09:05:58 == 9.10 h - same value,
      different rendering.
   ========================================================================= */

const ATT_ALL = "All";

function attFilter({ seg, month, hod, dept, grade }){
  const segIdx   = seg   === undefined || seg   === null || seg   === ATT_ALL ? -2 : ATT_SEGS.indexOf(seg);
  const monthIdx = month === undefined || month === null || month === ATT_ALL ? -2 : ATT_MONTHS.indexOf(month);
  const hodIdx   = hod   === undefined || hod   === null || hod   === ATT_ALL ? -2 : ATT_HODS.indexOf(hod);
  const deptIdx  = dept  === undefined || dept  === null || dept  === ATT_ALL ? -2 : ATT_DEPTS.indexOf(dept);
  const gradeIdx = grade === undefined || grade === null || grade === ATT_ALL ? -2 : ATT_GRADES.indexOf(grade);
  return ATTENDANCE.records.filter(r =>
    (segIdx   === -2 || r[1] === segIdx)   &&
    (monthIdx === -2 || r[0] === monthIdx) &&
    (hodIdx   === -2 || r[2] === hodIdx)   &&
    (deptIdx  === -2 || r[3] === deptIdx)  &&
    (gradeIdx === -2 || r[4] === gradeIdx));
}

// AVERAGEIFS semantics: skip blanks (null), keep zeros.
function mean_(rows, col){
  let s = 0, n = 0;
  for (const r of rows){ const v = r[col]; if (v !== null && v !== undefined){ s += v; n++; } }
  return n ? s/n : null;
}
// The sheet's own Avg Present Days / Avg Leave Days formulas (both the
// Monthly Trend row and the HOD-wise/Dept-wise columns) add an extra
// AVERAGEIFS criterion on that same column, ">0" - i.e. these two specific
// metrics average ONLY over rows where that column is non-zero (days with
// zero present/zero leave are excluded from the denominator entirely, not
// counted as a zero). Verified directly against the live sheet's formulas
// (Attendance!C7/C8 and !D17/E17 etc: "AVERAGEIFS(...,col,">0")"). This is
// NOT the case for Avg Working Hours / Avg Report>11AM / Avg Stay>7:15PM,
// which use plain AVERAGEIFS with no >0 filter - do not "fix" those.
function meanPositive_(rows, col){
  let s = 0, n = 0;
  for (const r of rows){ const v = r[col]; if (v !== null && v !== undefined && v > 0){ s += v; n++; } }
  return n ? s/n : null;
}
// SUMIFS semantics: blanks contribute nothing.
function sum_(rows, col){
  let s = 0;
  for (const r of rows){ const v = r[col]; if (v !== null && v !== undefined) s += v; }
  return s;
}

function attendanceMetrics(rows){
  // Attendance!C6 = SUMIFS(K)/SUMIFS(N,...,K,">0") - the DENOMINATOR also
  // carries the ">0" criterion on Present_Days, so any employee-month row
  // with zero Present_Days (fully absent that month) is excluded from BOTH
  // sides of the ratio, not just zeroed out. Verified directly against the
  // live sheet's formula text and its displayed % (69.6/63.1 for SaaS_MS
  // July/Aug'26) - matches to 2 d.p. once this row filter is applied.
  const presentRows = rows.filter(r => { const v = r[5]; return v !== null && v !== undefined && v > 0; });
  const present = sum_(presentRows, 5);
  const total   = sum_(presentRows, 8);
  const attendancePct = total > 0 ? present/total : null;      // Attendance!C6
  const avgPresent = meanPositive_(rows, 5);                   // Attendance!C7 ("K:K,">0"")
  const avgLeave   = meanPositive_(rows, 7);                   // Attendance!C8 ("M:M,">0"")
  const avgHours   = mean_(rows, 12);                          // Attendance!C9
  const avgReport  = mean_(rows, 9);                           // Attendance!C10
  const avgStay    = mean_(rows, 10);                          // Attendance!C11
  // Attendance!C12 - denominator is EVERY matching row, no col-Q criterion.
  const lt8Pct = rows.length ? rows.reduce((a,r)=>a+(r[11]||0),0)/rows.length : null;
  // Attendance!J17 / T17
  let flag = null;
  if (rows.length){
    flag = ((attendancePct !== null && attendancePct < 0.85) || (lt8Pct !== null && lt8Pct > 0.3))
      ? "⚠ Review" : "OK";
  }
  return { attendancePct, avgPresent, avgLeave, avgHours, avgReport, avgStay, lt8Pct, flag, n: rows.length };
}

// The 7 metrics, in the exact order and wording of Attendance!B6:B12.
const ATT_METRIC_REGISTRY = [
  { key:"attendancePct", label:"Attendance %",            fmt:fmtPct1, isPct:true  },
  { key:"avgPresent",    label:"Avg Present Days",        fmt:fmtNum1, isPct:false },
  { key:"avgLeave",      label:"Avg Leave Days",          fmt:fmtNum1, isPct:false },
  { key:"avgHours",      label:"Avg Working Hours",       fmt:fmtHoursMin, isPct:false },
  { key:"avgReport",     label:"Avg Report >11AM (days)", fmt:fmtNum1, isPct:false },
  { key:"avgStay",       label:"Avg Stay >7:15PM (days)", fmt:fmtNum1, isPct:false },
  { key:"lt8Pct",        label:"<8Hr Emp %",              fmt:fmtPct1, isPct:true  },
];

function MonthlyTrendSection({ segmentId }){
  /* Attendance!B5:J12 - one column per month. The sheet reserves future
     months (Sep'26..Feb'27) with no rows behind them; the shared
     trimTrailingEmpty helper drops those so the table stops at the last
     month that actually has Attendance_Data rows. */
  const allMonths = ATT_MONTHS;
  const allByMonth = useMemo(
    () => allMonths.map(mo => attendanceMetrics(attFilter({ seg:segmentId, month:mo }))),
    [segmentId, allMonths]);
  const months  = trimTrailingEmpty(allMonths, (i) => (allByMonth[i] || {}).n > 0);
  const byMonth = months.map((_, i) => allByMonth[i]);
  const [chartMetric, setChartMetric] = useState(ATT_METRIC_REGISTRY[0].key);
  const metric = ATT_METRIC_REGISTRY.find(m => m.key === chartMetric);

  return (

        <div className="card-title">Monthly Trend &mdash; {segmentId}</div>

          options={ATT_METRIC_REGISTRY.map(m => m.key)} />

      <div className="card-caption">
        Mirrors Attendance!C6:J12. New months appear automatically as the
        Attendance_Data feed grows &mdash; nothing here is hardcoded.
      </div>
      <MultiLineChart
        labels={months}
        series={[{ label: metric.label, data: byMonth.map(m => m[metric.key]), color:"#1f9d6b" }]}
        isPercent={metric.isPct} pctDecimals={1} height={200} />
      {/* Plain Metric x Month table, exactly like the Attendance tab's own
          Monthly Trend block: only the "Attendance %" row carries the
          conditional-format colour scale; every other metric row is plain. */}

        <table className="heatmap">
          <thead>
            <tr>
              <th style={{textAlign:"left"}}>Metric</th>
              {months.map(mo => <th key={mo}>{mo}</th>)}
            </tr>
          </thead>
          <tbody>
            {ATT_METRIC_REGISTRY.map(m => {
              const vals   = months.map((mo,i) => byMonth[i][m.key]);
              const shade  = (m.key === "attendancePct");

                    </td>
                  ))}

              );
            })}
          </tbody>
        </table>
      </div>
    </div>
  );
}

function GroupSummaryTable({ title, caption, groupLabel, names, rowsFor }){
  const computed = names.map(n => ({ name:n, ...attendanceMetrics(rowsFor(n)) })).filter(r => r.n > 0);

     PER COLUMN (per metric), direction per ATT_DIR. Emp-months and the
     ⚠ Flag column are deliberately left unshaded, as in the sheet. */
  const colStats = {};
  ATT_METRIC_REGISTRY.forEach(m => { colStats[m.key] = pctStats(computed.map(r => r[m.key])); });
  if (computed.length === 0){
    return (
      <div className="card">
        <div className="card-head"><div className="card-title">{title}</div></div>
        <div className="empty-note">No Attendance_Data rows for this segment / month combination.</div>

  return (
    <div className="card">
      <div className="card-head"><div className="card-title">{title}</div></div>
      {caption && <div className="card-caption">{caption}</div>}
      <div className="heatmap-scroll">

          </thead>
          <tbody>
            {computed.map(r => (
              <tr key={r.name}>
                <td className="rowlabel">{r.name}</td>
                <td>{r.n}</td>
                {ATT_METRIC_REGISTRY.map(m => (
                  <td key={m.key} style={heatStyle(percentileColor(r[m.key], colStats[m.key], ATT_DIR[m.key] || +1))}>

                  </td>

              </tr>
            ))}
          </tbody>
        </table>
      </div>
    </div>
  );
}

/* =========================================================================
   APPS SCRIPT INTEGRATION LAYER
   ============================================================================
   This section ONLY swaps the data source. It touches no rendering, chart,
   table or aggregation logic - every function above keeps reading the same
   module-level variable names (OVERVIEW, MANNING, ATTRITION, ATTENDANCE,
   PERIOD_REGISTRY, ATT_MONTHS, ...). Those are declared with `let` so this
   layer can reassign them once live data arrives.

   HOW TO GO LIVE (see Code_V2.gs header for the full walkthrough):
   1. On the NEW Google Sheet: Extensions > Apps Script, paste Code_V2.gs.
   2. Deploy > New deployment > Web app > Execute as: Me >
      Who has access: Anyone. Copy the /exec URL.
   3. Paste that URL into CONFIG.APPS_SCRIPT_URL below and reload.
   Until step 3 the dashboard runs on the embedded snapshot taken from
   HR_DB_final_July26_V3_validated.xlsx, so it always works out of the box
   and a bad deployment can never break the UI.
   ========================================================================= */
const CONFIG = {
  // <-- PASTE THE NEW SHEET'S APPS SCRIPT WEB APP /exec URL HERE.
  // Left intentionally EMPTY: this is a brand-new spreadsheet, so the old
  // deployment URL from the previous dashboard would read the WRONG sheet.
  APPS_SCRIPT_URL: "https://script.google.com/macros/s/AKfycbyWIjugZkJi1zQK39zhBsbe8w1yrjHgsUCoVDa7TNbbrX4oLp1wVidQlFjXlpKZL15o/exec",
};

let DATA_SYNC_LISTENERS = [];
const DATA_SYNC = { status: CONFIG.APPS_SCRIPT_URL ? "loading" : "idle", error: null, lastUpdated: null };
function setSyncStatus_(status, error){
  DATA_SYNC.status = status; DATA_SYNC.error = error || null;
  DATA_SYNC_LISTENERS.forEach(fn => fn());
}
function useSyncStatus(){
  const [, tick] = useState(0);
  useEffect(() => {
    const fn = () => tick(x=>x+1);
    DATA_SYNC_LISTENERS.push(fn);
    return () => { DATA_SYNC_LISTENERS = DATA_SYNC_LISTENERS.filter(f=>f!==fn); };
  }, []);
  return DATA_SYNC;
}

/* A hydrated block must never *lose* data that the embedded snapshot has.
   Root cause of the blank Overview attendance table: applyHydratedData_()
   replaced OVERVIEW wholesale, so any key the deployed Apps Script build did
   not return (attendanceTrend, on an older deployment) became undefined and
   the component rendered an empty table. Now every top-level key falls back
   to the snapshot when the live payload omits it or sends it empty. */
function isEmptyBlock_(v){
  if (v === null || v === undefined) return true;
  if (Array.isArray(v)) return v.length === 0;
  if (typeof v === "object"){
    const keys = Object.keys(v);
    if (!keys.length) return true;
    // {periods:[],metrics:[]}-shaped blocks count as empty when both are empty
    if (keys.every(k => Array.isArray(v[k])) && keys.every(k => v[k].length === 0)) return true;
    if (Array.isArray(v.metrics) && v.metrics.length === 0) return true;
  }
  return false;
}
function mergeWithSnapshot_(live, snap){
  const out = Object.assign({}, snap || {}, live || {});
  Object.keys(snap || {}).forEach(function(k){
    if (isEmptyBlock_(out[k]) && !isEmptyBlock_(snap[k])) out[k] = snap[k];
  });
  return out;
}

function applyHydratedData_(all){
  if (!all) return;
  // --- Overview (Data! "SUMMARY - ..." blocks) ---
  if (all.overview){
    OVERVIEW = mergeWithSnapshot_(all.overview, SNAP.overview);
    PERIOD_REGISTRY = sortPeriods(OVERVIEW.periods || Object.keys(OVERVIEW.manningPct || {}));
    LATEST_PERIOD = PERIOD_REGISTRY[PERIOD_REGISTRY.length - 1];
  }
  // --- Manning (Data! DEEP MANNING / DEEP HEADCOUNT / RECRUITMENT FUNNEL) ---
  if (all.manning){
    MANNING = mergeWithSnapshot_(all.manning, SNAP.manning);
    MANNING_PERIODS = MANNING.periods;
  }
  // --- Attrition (Data! DEEP TotAttr / DEEP VolAttr / Tenure blocks + Exit_Data) ---
  if (all.attrition){
    ATTRITION = mergeWithSnapshot_(all.attrition, SNAP.attrition);
    ATTR_PERIODS = ATTRITION.periods;
  }
  // --- Attendance (Attendance_Data raw rows) ---
  if (all.attendance){
    ATTENDANCE = mergeWithSnapshot_(all.attendance, SNAP.attendance);
    // Re-derive every option list from the freshly hydrated payload - these
    // must never be left pointing at the embedded snapshot's lists.
    ATT_SEGS  = ATTENDANCE.segs || SEGMENT_IDS;
    ATT_MONTHS = sortPeriods(ATTENDANCE.months || []);
    ATT_HODS   = ATTENDANCE.hods   || [];
    ATT_DEPTS  = ATTENDANCE.depts  || [];
    ATT_GRADES = ATTENDANCE.grades || [];
    ATT_LATEST_MONTH = ATT_MONTHS[ATT_MONTHS.length - 1];
  }
}

async function hydrateFromAppsScript(){
  if (!CONFIG.APPS_SCRIPT_URL){
    setSyncStatus_("idle", null);
    return;
  }
  setSyncStatus_("loading", null);
  try {
    // Cache-busting: Apps Script web apps sit behind a CDN that will
    // happily serve a stale body for identical URLs.
    const res = await fetch(`${CONFIG.APPS_SCRIPT_URL}?page=all&_=${Date.now()}`, { cache: "no-store" });
    const json = await res.json();
    if (!json.ok) throw new Error(json.error || "Apps Script returned ok:false");
    applyHydratedData_(json.data);
    DATA_SYNC.lastUpdated = new Date();
    setSyncStatus_("live", null);
  } catch (err){
    // Failure keeps whatever data is currently loaded (the embedded
    // snapshot) - the dashboard never breaks, it just surfaces a banner.
    setSyncStatus_("error", String(err));
  }
}

/* ---- ONE code path for both the initial load and the Refresh button.
       App registers DATA_TICK_BUMP_ so a refresh remounts the page tree
       (key={dataTick}) and every component re-reads the reassigned
       module-level data holders. ---- */
let DATA_TICK_BUMP_ = null;
async function refreshLiveData(){
  await hydrateFromAppsScript();          // exact same fetch + applyHydratedData_
  if (DATA_TICK_BUMP_) DATA_TICK_BUMP_();
  return DATA_SYNC.status;
}

function LastUpdated(){
  const sync = useSyncStatus();
  if (!sync.lastUpdated) return null;
  const t = sync.lastUpdated.toLocaleTimeString("en-IN", { hour:"2-digit", minute:"2-digit", second:"2-digit" });
  return <span className="last-updated">Last updated: {t}</span>;
}

function RefreshButton(){
  const sync = useSyncStatus();
  const [phase, setPhase] = useState("idle");   // idle | busy | ok | err
  const busy = phase === "busy" || sync.status === "loading";
  const click = async () => {
    if (busy) return;
    setPhase("busy");
    const status = await refreshLiveData();
    setPhase(status === "live" ? "ok" : "err");
    setTimeout(() => setPhase("idle"), 2000);
  };
  let label = <span>&#10227; Refresh data</span>;
  if (busy)              label = <span><span className="refresh-spin">&#10227;</span> Refreshing&hellip;</span>;
  else if (phase==="ok") label = <span>Updated &#10003;</span>;
  else if (phase==="err")label = <span>&#9888; Failed &mdash; retry</span>;
  return (
    <button className={"refresh-btn " + (phase==="ok" ? "ok" : phase==="err" ? "err" : "")}
            onClick={click} disabled={busy} title="Re-fetch the latest data from the Google Sheet">
      {label}
    </button>
  );
}

function SyncBanner(){
  const sync = useSyncStatus();
  if (sync.status === "live") return null;
  if (sync.status === "idle"){
    return (
      <div className="empty-note" style={{margin:"0 28px", borderRadius:0}}>
        &#9888; Running on the embedded snapshot (validated workbook, July'26 &amp; Aug'26).
        To go live, deploy Code_V2.gs on the new Google Sheet and paste its /exec URL into CONFIG.APPS_SCRIPT_URL.
      </div>
    );
  }
  if (sync.status === "loading"){
    return <div className="empty-note" style={{margin:"0 28px", borderRadius:0}}>Loading live data from Google Sheets&hellip;</div>;
  }
  return (
    <div className="empty-note" style={{margin:"0 28px", borderRadius:0}}>
      &#9888; Could not load live data from Apps Script &mdash; showing the last known snapshot. ({sync.error})
    </div>
  );
}

/* ============================ APP ROOT ============================ */
function App(){
  const hash = useHashRoute();
  const [, forceRender] = useState(0);
  const [dataTick, setDataTick] = useState(0);

  useEffect(() => {
    if (!AUTH_STATE.loggedIn && hash !== "#/login") navigate("#/login");
  }, [hash]);

  useEffect(() => {
    DATA_TICK_BUMP_ = () => setDataTick(t => t+1);
    refreshLiveData();                 // initial hydration, same path as Refresh
    return () => { DATA_TICK_BUMP_ = null; };
  }, []);

  if (!AUTH_STATE.loggedIn){
    return <LoginPage onLogin={() => forceRender(x=>x+1)} />;
  }

  const path = hash.replace("#/", "") || "overview";
  // key={dataTick} forces a full remount of the current page once live data
  // finishes hydrating, so every component re-reads the freshly reassigned
  // module-level data variables - no prop threading, no per-page changes.
  const page = (() => {
    if (path === "overview")   return <OverviewPage />;
    if (path === "manning")    return <ManningPage />;
    if (path === "attrition")  return <AttritionPage />;
    if (path === "attendance") return <AttendancePage />;
    if (path === "enps")       return <EnpsPage />;
    if (path === "payroll")    return <PayrollPage />;
    if (path === "cost")       return <CostPage />;
    return <OverviewPage />;
  })();

  return (
    <div key={dataTick}>
      <SyncBanner />
      {page}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);

</script>
</body>
